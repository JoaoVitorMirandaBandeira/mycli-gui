<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>my — MySQL</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{--bg:#fff;--bg2:#f4f5f7;--bg3:#e9ebef;--fg:#1c2330;--mut:#6b7585;--line:#d9dde4;--acc:#2f6fed;--accfg:#fff;--err:#c62828;--ok:#2e9e5b;--warn:#c77d00;--sel:#dbe7ff;--nul:#98a1b0;--zebra:#f9fafb;--tk:#b5179e;--ts:#2e7d32;--tn:#b45309;--tc:#8a94a3;--tf:#0369a1;--ti:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--bg2:#1b1f26;--bg3:#262c36;--fg:#e4e8ee;--mut:#8b95a5;--line:#2c323c;--acc:#5b92ff;--accfg:#0b1220;--err:#ff7b72;--ok:#4cc38a;--warn:#e3a33b;--sel:#26385e;--nul:#5f6877;--zebra:#171b21;--tk:#ff79c6;--ts:#a5d6a7;--tn:#f2a65a;--tc:#6b7585;--tf:#7dcfff;--ti:#e0af68}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.mono,table.g,.kv,.q{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;font-size:13px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b.logo{font-size:15px;letter-spacing:.5px;margin-right:4px}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:-1px}
button{cursor:pointer;background:var(--bg3)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
kbd{font:11px ui-monospace,monospace;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
button.pri kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.sp{flex:1}
#st{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;max-width:42ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#st.ok i{background:var(--ok)}#st.err i{background:var(--err)}#st.err{color:var(--err)}#st.warn i{background:var(--warn)}
#db{width:200px}
#main{flex:1;display:flex;min-height:0}
aside{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#side{width:250px;border-right:1px solid var(--line)}
#side.hide{display:none}
#side input{margin:8px;width:calc(100% - 16px)}
#tables{list-style:none;margin:0;padding:0 0 8px;overflow:auto;flex:1}
#tables li{display:flex;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap}
#tables li:hover{background:var(--bg3)}
#tables .n{flex:1;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace;font-size:12.5px}
#tables li.view .n{font-style:italic;color:var(--mut)}
#tables i{font-style:normal;color:var(--mut);padding:0 4px;border-radius:4px;visibility:hidden}
#tables li:hover i{visibility:visible}#tables i:hover{background:var(--line);color:var(--fg)}
#cnt{padding:4px 10px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
#work{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--bg2);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--mut);white-space:nowrap;max-width:220px}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--bg3)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--acc)}
.tab b{font-weight:400;opacity:.5}.tab b:hover{opacity:1;color:var(--err)}
#ed{position:relative;height:150px;min-height:56px;overflow:hidden;background:var(--bg);flex:none}
#split{flex:none;height:7px;margin:-3px 0;position:relative;z-index:5;cursor:row-resize;touch-action:none}
#split::after{content:"";position:absolute;left:0;right:0;top:3px;height:1px;background:var(--line);transition:background .12s,height .12s,top .12s}
#split:hover::after,#split.drag::after{background:var(--acc);height:3px;top:2px}
body.resizing{cursor:row-resize;user-select:none}
#ed:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
#ed .cm-editor{height:100%;font-size:13px}
#ed .cm-focused{outline:none}
#ed .cm-scroller{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;line-height:1.5}
#ed .cm-content{padding:10px 0;caret-color:var(--fg)}
#ed .cm-line{padding:0 14px}
#ed .cm-gutters{background:var(--bg2);color:var(--mut);border-color:var(--line)}
#ed .cm-foldGutter .cm-gutterElement{padding:0 4px;cursor:pointer}
#ed .cm-foldPlaceholder{background:var(--bg2);color:var(--mut);border-color:var(--line)}
#ed .cm-placeholder{color:var(--mut)}
#ed .cm-cursor{border-left-color:var(--fg)}
#ed .cm-content ::selection{background:var(--sel)}
.tk{color:var(--tk)}.ts{color:var(--ts)}.tn{color:var(--tn)}.tc{color:var(--tc)}.tf{color:var(--tf)}.ti{color:var(--ti)}
:root{--tb:#00796b}
@media (prefers-color-scheme:dark){:root{--tb:#5fd3c3}}
#ed .cm-content .tb,#ed .cm-content .tb *{color:var(--tb)}
#ac{position:fixed;display:none;z-index:60;min-width:260px;max-width:520px;max-height:288px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0006;padding:3px}
.ai{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.ai.on{background:var(--acc);color:var(--accfg)}
.ai .lb{font-family:ui-monospace,monospace;font-size:13px}
.ai small{margin-left:auto;padding-left:14px;opacity:.65;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:18px;height:18px;border-radius:4px;font:700 11px/18px ui-monospace,monospace;text-align:center;color:#fff}
.ic.table{background:#2e8b8b}.ic.col{background:#4a7bd8}.ic.kw{background:#a04fb5}.ic.fn{background:#c47a1a}.ic.db{background:#5c6b7a}
.sh{display:flex;align-items:center;gap:4px;padding-right:8px}
.sh input{flex:1;min-width:0}
.sh button{padding:3px 8px}
#res{flex:1;overflow:auto;min-height:0}
.msg{padding:28px;color:var(--mut);text-align:center}
.err{margin:12px;padding:10px 14px;border-left:4px solid var(--err);background:var(--bg2);color:var(--err);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}
.blk{margin-bottom:6px}
.bh{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.bh .q{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;max-width:45%}
.bh .meta{white-space:nowrap;font-size:12.5px;color:var(--mut)}
.bh .meta b{color:var(--warn)}
.bh .f{width:170px;padding:3px 8px}
.bh button{padding:3px 10px;white-space:nowrap}
.blk.ok .meta{color:var(--ok)}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
table.g th{position:sticky;top:36px;z-index:2;background:var(--bg3);text-align:left;padding:5px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
table.g th:hover{color:var(--acc)}
table.g td{padding:3px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis}
table.g tr:nth-child(even) td{background:var(--zebra)}
table.g tr:hover td{background:var(--bg3)}
table.g tr.sel td{background:var(--sel)}
td.rn,th.rn{color:var(--mut);text-align:right;width:1%;background:var(--bg2)!important;cursor:default;position:sticky;left:0}
th.rn{z-index:4}
td.num{text-align:right}
table.g td.fk .fkgo,.kv td.fk .fkgo{float:right;margin-left:8px;padding:0 6px;line-height:1.35;font-size:12px;border-color:var(--acc);color:var(--acc);background:var(--bg);visibility:hidden}
table.g td.fk:hover .fkgo,.kv tr:hover td.fk .fkgo,.fkgo:focus-visible{visibility:visible}
.fkgo:hover{background:var(--acc)!important;color:var(--accfg)!important}
.fkb{font-size:10px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:3px;padding:0 3px;margin-left:6px;vertical-align:1px}
.crumb{padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
table.g td.changed{box-shadow:inset 3px 0 var(--warn)}
table.g td.can-edit{cursor:text}
.cell-value{display:block;width:100%;border:0;border-radius:0;background:transparent;color:inherit;padding:0;text-align:inherit;overflow:hidden;text-overflow:ellipsis}
.cell-value:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.cell-editor{display:flex;gap:4px;align-items:center}
.cell-editor textarea{min-width:140px;width:100%;padding:3px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.cell-editor button{padding:3px 6px}
.nul{color:var(--nul);font-style:italic}
.rec{margin:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rh{padding:5px 12px;background:var(--bg3);font-weight:600;display:flex;align-items:center}
.kv{width:100%;border-collapse:collapse}
.kv th{width:1%;white-space:nowrap;text-align:right;vertical-align:top;color:var(--acc);padding:2px 12px;font-weight:600}
.kv td{padding:2px 12px;white-space:pre-wrap;word-break:break-word;cursor:copy}
.kv tr:hover td{background:var(--bg3)}
#rec{width:360px;border-left:1px solid var(--line);overflow:auto;display:none}
#rec.show{display:flex}
#rec .rh button{margin-left:auto;padding:0 8px;border:0;background:transparent}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:min(820px,92vw);max-height:80vh;padding:0;margin:auto}
dialog::backdrop{background:#0008}
dialog input{width:calc(100% - 24px);margin:12px}
#kd h3{margin:0;padding:14px 16px 4px;font-size:15px}
#kd .kg{padding:4px 16px 14px;columns:2 320px;column-gap:28px}
#kd h4{margin:12px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
#kd .kr{display:flex;justify-content:space-between;gap:12px;padding:3px 0;break-inside:avoid}
#kd .kr span{white-space:nowrap}
#kd .kr span:first-child{white-space:normal}
#kd{overflow-x:hidden}
#ad{width:min(560px,92vw)}
#ad .ab{padding:14px 18px}
#ad h3{margin:0 0 4px;font-size:16px}
#ad h3 small{color:var(--mut);font-weight:400;margin-left:6px}
#ad p{margin:4px 0 0;color:var(--mut)}
#ad h4{margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#ad ul{list-style:none;margin:0;padding:0}
#ad li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
#ad li a{color:var(--acc);text-decoration:none}
#ad li a:hover{text-decoration:underline}
#ad .af{display:flex;align-items:center;margin-top:16px}
#ad .af a{color:var(--acc)}
#hl{overflow:auto;max-height:62vh;padding:0 0 8px}
.hi{padding:6px 16px;cursor:pointer;border-top:1px solid var(--line)}
.hi:hover{background:var(--bg3)}
.hi small{color:var(--mut);display:block}
.hi code{white-space:pre-wrap;font:12.5px ui-monospace,monospace;display:block;max-height:5.6em;overflow:hidden}
#cf{padding:18px 22px;width:min(460px,92vw);display:flex;flex-direction:column;gap:10px}
#cf h3{margin:0 0 4px}
#cf label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut);flex:1}
#cf input{width:100%;margin:0;color:var(--fg)}
#cf label.chk{flex-direction:row;align-items:center;gap:6px;flex:none}#cf label.chk input{width:auto}
#cf .row{display:flex;gap:10px}#cf .sm{flex:0 0 100px}
#cf .cb{display:flex;gap:8px;margin-top:6px}
#cm{min-height:1.3em;font-size:13px;white-space:pre-wrap}#cm.ok{color:var(--ok)}#cm.bad{color:var(--err)}
button.danger{color:var(--err)}
button.pri.stop{background:var(--err);border-color:var(--err);color:#fff}
tr.more td{text-align:center;color:var(--mut);background:var(--bg2)!important;cursor:default}
.msg b{color:var(--fg);font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:.92}
#ver{font-size:12px;color:var(--mut);background:transparent;border:0;padding:0 4px;cursor:pointer}
#ver:hover{color:var(--fg)}
#upd{background:var(--ok);border-color:var(--ok);color:#fff}
/* plano de execução (Visual Explain) */
:root{--a-blue:#2f6fed;--a-green:#23905a;--a-yellow:#a98a00;--a-orange:#dd6f00;--a-red:#d23a3a;--a-gray:#6f7a8a;--pv-edge:#a3abb8;--pv-node:#fff;--pv-hot:#e79a9a}
@media (prefers-color-scheme:dark){:root{--a-blue:#4f8bff;--a-green:#33b073;--a-yellow:#c9a91a;--a-orange:#f08a2a;--a-red:#f05a5a;--a-gray:#7d8797;--pv-edge:#56606f;--pv-node:#1e232b;--pv-hot:#8f4747}}
.pblk{height:100%;display:flex;flex-direction:column;margin:0}
.pblk .bh{flex-wrap:nowrap}
.pblk .bh .q{flex:1 1 0;max-width:none;min-width:40px}
.pblk .bh .meta{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pblk .bh>*:not(.q):not(.meta){flex:none}
.pv-seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.pv-seg button{border:0;border-radius:0;background:var(--bg);padding:3px 10px}
.pv-seg button+button{border-left:1px solid var(--line)}
.pv-seg button.on{background:var(--acc);color:var(--accfg)}
.pv-color{padding:3px 6px;font-size:12.5px}
.pv-zoom{display:inline-flex;align-items:center;gap:2px}
.pv-zoom button{padding:3px 8px}
.pv-zl{min-width:42px;text-align:center;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.pv-ins{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;align-items:flex-start}
.pv-instg{flex:none;align-self:center;padding:3px 9px;font-size:12px;white-space:nowrap}
.pv-ins.open .pv-instg{align-self:flex-start}
.pv-ins:not(.open){padding:6px 12px;align-items:center}
.pv-ins:not(.open) .pv-ic{width:auto;max-width:340px;padding:4px 10px 4px 8px;align-items:center;gap:7px}
.pv-ins:not(.open) .pv-ic b{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.pv-ins:not(.open) .pv-ic>div{min-width:0}
.pv-ins:not(.open) .pv-ic p{display:none}
.pv-ins:not(.open) .pv-sv{width:17px;height:17px;font-size:11px;line-height:17px}
.pv-ic{flex:none;width:300px;display:flex;gap:9px;padding:7px 10px;border:1px solid var(--line);border-left:4px solid var(--sev);border-radius:8px;background:var(--bg);cursor:pointer;font-size:12.5px}
.pv-ic:hover{border-color:var(--sev);background:var(--bg2)}
.pv-ic b{display:block;font-size:13px;margin-bottom:2px}
.pv-ic p{margin:0;color:var(--mut)}
.pv-ic .pv-go{color:var(--acc);margin-top:3px}
.pv-sv{flex:none;width:20px;height:20px;border-radius:50%;background:var(--sev);color:#fff;font:700 12px/20px system-ui;text-align:center}
.pv-body{flex:1;display:flex;min-height:0}
.pv-cv{flex:1;position:relative;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;cursor:grab;outline:none;min-width:0}
.pv-cv.drag{cursor:grabbing}
.pv-cv>svg{position:absolute;inset:0;width:100%;height:100%;user-select:none}
.pv-view{flex:1;overflow:auto;display:none;min-width:0}
.pv-nd{cursor:pointer}
.pv-nd text{font-size:12px;fill:var(--fg)}
.pv-bx{fill:var(--pv-node);stroke:var(--line);stroke-width:1;filter:drop-shadow(0 1px 2px #0002)}
.pv-nd:hover .pv-bx{stroke:var(--acc)}
.pv-nd.sel .pv-bx,.pv-nd.sel .pv-dm{stroke:var(--acc)!important;stroke-width:2.5!important}
.pv-nd .pv-bl{fill:#fff;font-size:11px;font-weight:700}
.pv-nd .pv-nm{font-size:13.5px;font-weight:700}
.pv-nd .pv-al,.pv-nd .pv-mt{fill:var(--mut);font-weight:400}
.pv-nd .pv-ky{fill:var(--mut);font-family:ui-monospace,monospace;font-size:11px}
.pv-nd .pv-ft{font-size:11.5px;font-variant-numeric:tabular-nums}
.pv-heatbg{fill:var(--bg3)}
.pv-nd .pv-op{font-size:12.5px;font-weight:700}
.pv-nd .pv-fl{fill:var(--warn);font-size:11px}
.pv-blk{fill:var(--fg)}
.pv-nd .pv-blkt{fill:var(--bg);font-weight:700}
.pv-nd .pv-blks{fill:var(--bg);opacity:.75;font-size:11px}
.pv-dm{fill:var(--pv-node);stroke:var(--mut);stroke-width:1.5}
.pv-nd .pv-dml{fill:var(--mut);font-size:11px}
.pv-nd .pv-dmi{font-size:15px;font-weight:700}
.pv-pill{fill:var(--bg2);stroke:var(--line)}
.pv-pillt{font-size:10.5px;fill:var(--mut);font-variant-numeric:tabular-nums}
.pv-eg{fill:none;stroke:var(--pv-edge);stroke-linejoin:round}
.pv-eg.sub{stroke-dasharray:6 5}
.pv-eg.hot{stroke:var(--pv-hot)}
.pv-ah{fill:var(--pv-edge);stroke:none;stroke-dasharray:none}
.pv-ah.hot{fill:var(--pv-hot)}
.pv-frame{fill:color-mix(in srgb,var(--acc) 4%,transparent);stroke:var(--mut);stroke-dasharray:5 5}
.pv-framet{fill:var(--mut);font-size:11px;font-weight:600}
#pvtip{position:fixed;z-index:70;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0004;padding:8px 10px;font-size:12.5px;max-width:340px;display:none}
#pvtip b{display:block}#pvtip .h{color:var(--mut)}#pvtip .r{display:flex;justify-content:space-between;gap:16px}
.pv-leg{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.pv-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pv-heat{width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--a-green),var(--a-yellow),var(--a-orange),var(--a-red))}
.pv-lr{display:flex;justify-content:space-between;color:var(--mut)}
.pv-mini{position:absolute;right:10px;bottom:10px;width:170px;height:110px;background:color-mix(in srgb,var(--bg2) 92%,transparent);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.pv-mini svg{width:100%;height:100%}
.pv-vpr{fill:color-mix(in srgb,var(--acc) 12%,transparent);stroke:var(--acc);stroke-width:1.5}
.pv-det{width:330px;border-left:1px solid var(--line);background:var(--bg2);overflow:auto;flex:none;position:relative;font-size:12.5px}
.pv-det h3{margin:0;padding:12px 34px 2px 14px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-det h3 small{color:var(--mut);font-weight:400}
.pv-x{position:absolute;right:8px;top:8px;border:0;background:transparent;padding:0 6px;font-size:16px;color:var(--mut)}
.pv-acc{color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.pv-hint{padding:0 14px 8px;color:var(--mut)}
.pv-det h4{margin:12px 14px 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pv-det table{width:calc(100% - 28px);margin:0 14px;border-collapse:collapse}
.pv-det td{padding:2px 0;vertical-align:top}
.pv-det td:first-child{color:var(--mut);white-space:nowrap;padding-right:12px;width:1%}
.pv-det td:last-child{font-variant-numeric:tabular-nums;word-break:break-word}
.pv-det pre{margin:0 14px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;white-space:pre-wrap;word-break:break-word}
.pv-rawd{margin:12px 14px 14px}
.pv-rawd summary{cursor:pointer;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pv-det .pv-rawd pre{margin:6px 0 0;max-height:320px;overflow:auto;white-space:pre}
.pv-tip2{margin:6px 14px;padding:8px 10px;border-left:3px solid var(--sev,var(--acc));background:var(--bg);border-radius:4px}
.pv-tip2 pre{margin:6px 0!important}
.pv-codew{margin:4px 14px 6px}
.pv-tip2 .pv-codew{margin:6px 0}
.pv-code{border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.pv-code .cm-editor{font-size:12.5px;max-height:340px}
.pv-code .cm-editor.cm-focused{outline:none}
.pv-code .cm-scroller{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;line-height:1.5}
.pv-code .cm-content{padding:6px 0}
.pv-code .cm-line{padding:0 10px}
.pv-codeb{display:flex;gap:6px;margin-top:5px}
.pv-cnt{opacity:.75;font-size:11.5px}
.pv-rw{margin:12px;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--a-green);border-radius:8px;background:var(--bg2)}
.pv-rw.flat,.pv-rw.wait{border-left-color:var(--line)}
.pv-rw.flat{opacity:.8}
.pv-rw h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-rw p{margin:0 0 6px;color:var(--mut);font-size:12.5px;max-width:110ch}
.pv-rw .pv-cav{color:var(--warn)}
.pv-rw h4{margin:6px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pv-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:1100px){.pv-cols{grid-template-columns:1fr}}
.pv-badge{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mut);background:var(--bg)}
.pv-badge.ok{color:#fff;background:var(--a-green);border-color:var(--a-green)}
.pv-badge.bad{color:var(--a-red);border-color:var(--a-red)}
.pv-kind{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 5px}
.pv-sughead{display:flex;align-items:center;gap:8px;margin:12px 12px 0;color:var(--mut);font-size:12.5px}
.pv-sughead b{color:var(--fg)}
.pv-badge a{color:var(--acc)}
.pv-view .pv-code .cm-editor{max-height:420px}
.pv-codeb button{padding:1px 8px;font-size:12px}
.pv-tip2 button{padding:1px 8px;font-size:12px}
.pv-empty{padding:14px;color:var(--mut);line-height:1.5}
.pv-empty b{color:var(--fg)}
.pv-mt{color:var(--mut)}
.pv-w{color:var(--warn)}
.pv-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:3px;min-width:50px}
.pv-bar i{display:block;height:100%}
.pv-pct{display:flex;align-items:center;gap:6px;min-width:150px}.pv-pct .pv-bar{flex:1;margin:0}
.pv-chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px}
.pv-chip{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 7px;background:var(--bg)}
.pv-chip.w{border-color:var(--warn);color:var(--warn)}
.pv-tn{display:inline-flex;align-items:center;gap:6px}
.pv-tn i{width:9px;height:9px;border-radius:2px;flex:none}
.pv-view table.g th{top:0}
.pv-view tr[data-id],.pv-view tr[data-t]{cursor:pointer}
.pv-rawbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.pv-raw{margin:0;padding:12px 16px;white-space:pre;line-height:1.5}
.pv-raw .k{color:var(--acc)}.pv-raw .s{color:var(--ok)}.pv-raw .n{color:var(--warn)}
@media (max-width:980px){.pv-det{display:none;position:absolute;right:0;top:0;bottom:0;z-index:4;box-shadow:-8px 0 24px #0003}.pv-det.show{display:block}.pv-body{position:relative}}
</style>
</head>
<body>
<header>
  <button id="tg" title="Mostrar/ocultar tabelas">☰</button>
  <b class="logo">my</b>
  <select id="alias" title="Conexão"></select>
  <button id="ca" title="Nova conexão">＋</button><button id="ce" title="Editar esta conexão">✎</button>
  <input id="db" list="dbs" placeholder="banco (digite para filtrar)" autocomplete="off" title="Banco de dados">
  <datalist id="dbs"></datalist>
  <span id="st"><i></i><span>iniciando…</span></span>
  <span class="sp"></span>
  <button id="upd" hidden>⬆ Nova versão disponível</button>
  <button id="ver" class="mono" title="Clique para verificar atualizações">v…</button>
  <label class="mono" style="font-size:12.5px;color:var(--mut)">linhas máx.
    <select id="limit"><option>200</option><option selected>1000</option><option>5000</option><option>20000</option></select></label>
  <button id="hist" title="Alt+H">Histórico</button>
  <button id="kb" title="Atalhos de teclado (F1)">⌨</button>
  <button id="ab" title="Sobre o my-gui e contribuintes">ⓘ</button>
  <button id="run" class="pri" title="Executar seleção ou query sob o cursor (Ctrl+Enter ou F5). Script inteiro: Ctrl+Shift+Enter. Plano de execução, sem executar: Ctrl+E.">▶ Executar <kbd>Ctrl+↵</kbd></button>
</header>
<div id="main">
  <aside id="side">
    <div class="sh"><input id="tf" placeholder="filtrar tabelas…" autocomplete="off"><button id="rf" title="Recarregar tabelas e colunas (após criar/alterar tabelas)">⟳</button></div>
    <ul id="tables"></ul>
    <div id="cnt"></div>
  </aside>
  <section id="work">
    <div id="tabs"></div>
    <div id="ed"></div>
    <div id="split" title="Arraste para redimensionar"></div>
    <div id="res"></div>
  </section>
  <aside id="rec"></aside>
</div>
<dialog id="hd"><input id="hq" placeholder="buscar no histórico…" autocomplete="off"><div id="hl"></div></dialog>
<dialog id="kd"><h3>Atalhos de teclado</h3><div class="kg" id="kl"></div></dialog>
<dialog id="ad"><div class="ab">
  <h3>my-gui <small class="mono" id="av"></small></h3>
  <p>Cliente MySQL leve em janela, em cima do <code>mycli</code>.</p>
  <h4>Contribuintes</h4>
  <ul id="al"></ul>
  <div class="af"><a id="ar" target="_blank" rel="noopener noreferrer">Repositório no GitHub</a><span class="sp"></span><button type="button" id="ax">Fechar</button></div>
</div></dialog>
<dialog id="cd"><form id="cf" autocomplete="off">
  <h3 id="ct">Nova conexão</h3>
  <label>Nome da conexão<input id="cn" placeholder="ex.: producao" required></label>
  <div class="row"><label>Host / IP<input id="ch" placeholder="10.0.0.5" required></label><label class="sm">Porta<input id="cp" type="number" min="1" max="65535" value="3306"></label></div>
  <label>Usuário<input id="cu" autocomplete="off"></label>
  <label>Senha<input id="cw" type="password" autocomplete="new-password"></label>
  <label class="chk"><input id="cs" type="checkbox"> Usar SSL <small>(desmarcado = <code>--ssl-mode off</code>; use se o servidor exigir SSL)</small></label>
  <div id="cm"></div>
  <div class="cb"><button type="button" id="cx" class="danger">Excluir</button><span class="sp"></span><button type="button" id="ctest">Testar</button><button type="button" id="cc">Cancelar</button><button type="submit" class="pri">Salvar</button></div>
</form></dialog>
<div id="ac"></div>
<div id="toast"></div>
<div id="pvtip"></div>

<script>
const TOKEN='__TOKEN__';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bq=n=>'`'+n.replace(/`/g,'``')+'`';
const S={alias:'',db:'',lastDb:{},dbsCache:{},tabs:[],act:0,tables:[]};
let nextId=1,saveT=null;
let HIST=[],stateReady=false;

let DEAD=false;
async function api(path,body){
  if(DEAD)return{error:'Servidor local encerrado. Feche esta janela e abra o my-gui de novo.'};
  try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:JSON.stringify(body||{})});return await r.json()}
  catch(e){return{error:'Servidor local indisponível (a janela foi encerrada?)'}}
}
// Servidor morto (watchdog, kill, reboot): para de pingar/tentar e avisa; o token morreu junto,
// então retomar não adianta. Sem isso a janela ficava órfã falhando a cada 5 s para sempre.
let pingFails=0;
async function pingLoop(){
  if(DEAD)return;
  const r=await api('/api/ping');
  if(r&&r.error&&/indispon/.test(r.error)){
    if(++pingFails>=4){serverGone();return}
  }else pingFails=0;
  setTimeout(pingLoop,5000);
}
function serverGone(){
  DEAD=true;
  try{flush()}catch(e){}
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.82);color:#fff;font:16px sans-serif;text-align:center;padding:24px';
  o.innerHTML='<b style="font-size:20px">O servidor do my-gui foi encerrado</b><span>Feche esta janela e abra o my-gui novamente.</span>';
  const b=document.createElement('button');b.textContent='Fechar janela';b.style.cssText='padding:8px 18px;font-size:15px;cursor:pointer';
  b.onclick=()=>window.close();o.appendChild(b);document.body.appendChild(o);
  setTimeout(()=>window.close(),30000);
}
async function apiPw(path,body){
  let r=await api(path,body);
  if(r.need_password){
    const p=prompt('Senha de "'+body.alias+'" (não fica salva em disco):');
    if(p===null)return r;
    await api('/api/password',{alias:body.alias,password:p});
    r=await api(path,body);
  }
  return r;
}
function setStatus(t,k){const e=$('#st');e.className=k||'';e.querySelector('span').textContent=t;e.title=t}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1100)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado'),()=>toast('Não foi possível copiar'))}

/* ---------- estado ---------- */
/* estado guardado no servidor (~/.config/my-gui/state.json): sobrevive a fechar a janela */
let histDirty=false;
const stateDoc=()=>{const d={ui:{alias:S.alias,dbs:S.lastDb,act:S.act,tabs:S.tabs.map(t=>({title:t.title,sql:t.sql,pinned:!!t.pinned}))}};if(histDirty){d.hist=HIST;histDirty=false}return d};
function save(){if(!stateReady)return;clearTimeout(saveT);saveT=setTimeout(flush,250)}
function flush(){
  if(!stateReady)return;clearTimeout(saveT);
  const body=JSON.stringify({state:stateDoc()});
  fetch('/api/state/set',{method:'POST',keepalive:body.length<60000,headers:{'Content-Type':'application/json','X-Token':TOKEN},body}).catch(()=>{histDirty=true});
}
const cur=()=>S.tabs[S.act];
function newTab(sql='',title='consulta',pinned=false){S.tabs.push({id:nextId++,title,sql,pinned,results:[],error:null,running:false,back:[]});S.act=S.tabs.length-1;drawTabs();loadEditor();save();return cur()}
function switchTab(i){S.act=i;drawTabs();loadEditor();save()}
const CLOSED=[];
function closeTab(i){
  if(!replaceResults(S.tabs[i]))return;
  const ct=S.tabs[i];if(ct.sql.trim()){CLOSED.push({sql:ct.sql,title:ct.title,pinned:ct.pinned});if(CLOSED.length>20)CLOSED.shift()}
  if(S.tabs.length===1){Object.assign(S.tabs[0],{sql:'',title:'consulta',results:[],error:null,table:null,back:[]});drawTabs();loadEditor();save();return}
  S.tabs.splice(i,1);S.act=Math.min(S.act,S.tabs.length-1);if(i<S.act)S.act--;drawTabs();loadEditor();save();
}
function reopenTab(){const t=CLOSED.pop();if(!t)return toast('Nenhuma aba fechada para reabrir');newTab(t.sql,t.title,t.pinned);editor.focus()}
function stepTab(d){if(S.tabs.length>1)switchTab((S.act+d+S.tabs.length)%S.tabs.length)}
function drawTabs(){
  $('#tabs').innerHTML=S.tabs.map((t,i)=>`<div class="tab ${i===S.act?'on':''}" data-i="${i}"><span>${esc(t.title)}</span><b data-x="${i}">×</b></div>`).join('')+'<div class="tab" id="plus" title="Nova aba (Alt+N)">＋</div>';
}
function loadEditor(){setSql(cur().sql);renderRes();hideRec();acClose();updateRun()}
$('#tabs').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x)return closeTab(+x.dataset.x);
  if(e.target.closest('#plus')){newTab();editor.focus();return}
  const t=e.target.closest('.tab');if(t)switchTab(+t.dataset.i);
});
// Ctrl+W é reservado pelo Chrome (fecharia a janela); o Keyboard Lock pede que ele entregue a tecla à página.

async function setAlias(a,keepDb){
  S.alias=a;save();$('#alias').value=a;S.tables=[];
  const pre=keepDb&&S.cache[a+'|'+keepDb];
  if(pre&&pre.tables){setDbValue(keepDb);S.tables=pre.tables}  // mostra o cache na hora
  drawTables();
  const cd=S.dbsCache[a];
  if(cd){S.dbs=cd;$('#dbs').innerHTML=cd.map(d=>`<option value="${esc(d)}">`).join('')}
  setStatus('conectando…','warn');
  const r=await apiPw('/api/databases',{alias:a});
  if(S.alias!==a)return;
  if(r.error){setStatus(r.error,'err');$('#dbs').innerHTML='';setDbValue('');return}
  S.dbsCache[a]=r.databases;
  $('#dbs').innerHTML=r.databases.map(d=>`<option value="${esc(d)}">`).join('');
  S.dbs=r.databases;setStatus('conectado','ok');
  const want=keepDb&&r.databases.includes(keepDb)?keepDb:(r.db||'');
  await setDb(want);
}
function setDbValue(d){S.db=d;$('#db').value=d}
async function setDb(d){
  setDbValue(d);S.lastDb[S.alias]=d;save();
  const e=d?ent(d):null;
  S.tables=(e&&e.tables)||[];drawTables();   // cache na hora; abaixo revalida em segundo plano
  if(!d)return;
  const r=await apiPw('/api/tables',{alias:S.alias,db:d});
  if(S.db!==d)return;
  if(r.error){setStatus(r.error,'err');return}
  const same=S.tables.length===r.tables.length&&S.tables.every((t,i)=>t[0]===r.tables[i][0]&&t[1]===r.tables[i][1]);
  e.tables=r.tables;
  if(!same){S.tables=r.tables;drawTables()}
}

/* ---------- executar ---------- */
function danger(sql, ranges=sqlStatements(sql)){
  for(const {from,bodyEnd} of ranges){
    const statement=sql.slice(from,bodyEnd),command=sqlCommand(statement);
    if(/^(drop|truncate)\b/i.test(command)||(/^(delete|update)\b/i.test(command)&&!/\bwhere\b/i.test(command)))return statement;
  }
}
async function run(script=false){
  const t=cur(),{doc,selection}=editor.state;
  if(!t)return;
  if(t.running)return toast('Já executando — use Cancelar (Esc)');
  const {from,to,empty}=selection.main;
  let sql,dg;
  try{
    if(script||!empty){
      sql=script?doc.toString():doc.sliceString(from,to);
      const ranges=sqlStatements(sql);
      if(!ranges.length)return toast('Nenhuma consulta para executar');
      dg=danger(sql,ranges);
    }else{
      const active=statementAt(doc,from);
      if(!active)return toast('Nenhuma consulta para executar');
      const statement=doc.sliceString(active.from,active.to);
      sql=active.delimiter===';'?statement:'DELIMITER '+active.delimiter+'\n'+statement;
      dg=danger(statement,[{from:0,bodyEnd:active.bodyEnd-active.from}]);
    }
  }catch(error){
    if(!(error instanceof SqlParseError))throw error;
    return toast(error.message);
  }
  if(!S.alias)return toast('Escolha uma conexão');
  if(dg&&!confirm(`Comando destrutivo ou sem WHERE\nConexão: ${S.alias}${S.db?' · banco: '+S.db:''}\n\n${dg.trim().slice(0,240)}\n\nExecutar mesmo assim?`))return;
  if(!replaceResults(t))return;
  const source=t.table;
  const table=source?.sql===sql&&source.alias===S.alias&&source.db===S.db?source.name:undefined;
  const nx=t.fkNext;t.fkNext=null;
  const fkSrc=table?{alias:S.alias,db:S.db,table}:nx&&nx.sql===sql&&nx.alias===S.alias?nx:simpleSelect(sql);
  t.running=true;t.error=null;t.qid=Math.random().toString(36).slice(2);t.t0=Date.now();t.qalias=S.alias;
  if(t===cur())renderRes();
  if(!t.pinned)t.title=sql.replace(/\s+/g,' ').trim().slice(0,28)||t.title;
  drawTabs();updateRun();startTick();
  const r=await apiPw('/api/query',{alias:t.qalias,db:S.db,sql,table,limit:+$('#limit').value,qid:t.qid});
  t.running=false;
  t.results=r.results||[];t.error=r.error||null;
  if(fkSrc&&t.results.length===1&&t.results[0].columns.length)attachFks(t,t.results[0],fkSrc);
  if(t===cur()){renderRes();hideRec();updateRun()}
  if(S.alias===t.qalias&&r.db!==undefined&&r.db!==null&&r.db!==S.db){setDbValue(r.db);setDb(r.db)}
  if(!r.error&&/\b(create|drop|alter|rename)\s+(or\s+replace\s+)?(table|view)\b/i.test(sql)&&S.db){invalidate(S.db);setDb(S.db)}
  pushHist(sql);save();
}
function cancelRun(){const t=cur();if(!t.running)return;api('/api/cancel',{alias:t.qalias,qid:t.qid});toast('Cancelando…')}
function updateRun(){const t=cur(),b=$('#run');b.classList.toggle('stop',!!t.running);b.innerHTML=t.running?'■ Cancelar <kbd>Esc</kbd>':'▶ Executar <kbd>Ctrl+↵</kbd>'}

const fmtMs=ms=>ms<1000?ms+' ms':(ms/1000).toFixed(2)+' s';

function blk(r,i){

  if(!r.columns.length)return `<div class="blk ok"><div class="bh"><span class="q">${q}</span><span class="sp"></span><span class="meta">OK · ${r.affected} linha(s) afetada(s) · ${fmtMs(r.ms)}</span></div></div>`;
  const n=r.rows.length;

}
function cmp(x,y){
  if(x===null||y===null)return (x===null)-(y===null);
  const nx=typeof x==='number'?x:(/^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):NaN),ny=typeof y==='number'?y:(/^-?\d+(\.\d+)?$/.test(y)?parseFloat(y):NaN);
  if(!isNaN(nx)&&!isNaN(ny))return nx-ny;
  return String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'});
}
function view(r){
  let idx=r.rows.map((_,i)=>i);
  const f=(r.filter||'').toLowerCase();
  if(f)idx=idx.filter(i=>r.rows[i].some(v=>v!==null&&String(v).toLowerCase().includes(f)));
  if(r.sort){const{j,d}=r.sort;idx.sort((a,b)=>cmp(r.rows[a][j],r.rows[b][j])*d)}
  return idx;
}
const CHUNK=300,MORE=600;
function rowHtml(r,i,k){
  let h=`<tr data-r="${i}"${r.sel===i?' class="sel"':''}><td class="rn">${k+1}</td>`;
  r.rows[i].forEach((_,j)=>{h+=cellHtml(r,i,j)});
  return h+'</tr>';
}
const moreRow=(r,idx,shown)=>shown<idx.length?`<tr class="more"><td colspan="${r.columns.length+1}">Mostrando ${shown} de ${idx.length} — role para carregar mais…</td></tr>`:'';
function grid(r){
  const idx=r._idx=view(r);
  if(r.vert)return vert(r,idx);
  r.shown=Math.min(CHUNK,idx.length);
  let h='<table class="g"><thead><tr><th class="rn">#</th>';
  r.columns.forEach((c,j)=>{const f=r.fkmap?.get(j);h+=`<th data-j="${j}"${f?` title="${esc(fkTitle(f))}"`:''}>${esc(c)}${f?'<span class="fkb">FK</span>':''}${r.sort&&r.sort.j===j?(r.sort.d>0?' ▲':' ▼'):''}</th>`});
  h+='</tr></thead><tbody>';
  for(let k=0;k<r.shown;k++)h+=rowHtml(r,idx[k],k);
  return h+moreRow(r,idx,r.shown)+'</tbody></table>'+(idx.length?'':'<div class="msg">Nenhuma linha.</div>');
}
const moreObs=new IntersectionObserver(es=>{
  for(const en of es){
    if(!en.isIntersecting)continue;
    const tr=en.target,b=tr.closest('.blk');if(!b)continue;
    const r=cur().results[+b.dataset.i];if(!r||!r._idx)continue;
    moreObs.unobserve(tr);
    const idx=r._idx,from=r.shown,to=Math.min(from+MORE,idx.length);let h='';
    for(let k=from;k<to;k++)h+=rowHtml(r,idx[k],k);
    r.shown=to;const tb=tr.parentNode;tr.remove();
    tb.insertAdjacentHTML('beforeend',h+moreRow(r,idx,to));
    const nm=tb.querySelector('tr.more');if(nm)moreObs.observe(nm);
  }
},{root:$('#res'),rootMargin:'800px'});
const observeMore=scope=>scope.querySelectorAll('tr.more').forEach(tr=>moreObs.observe(tr));
function kv(r,i){
  return '<table class="kv">'+r.columns.map((c,j)=>{const v=r.rows[i][j];const f=r.fkmap?.get(j);return `<tr><th>${esc(c)}</th>${v===null?'<td class="nul">NULL</td>':`<td${f?' class="fk"':''}>${f?fkBtn(f,j):''}${esc(v)}</td>`}</tr>`}).join('')+'</table>';
}

function csv(r){

/* ---------- chaves estrangeiras ---------- */
const cellText=td=>{const c=td.cloneNode(true);c.querySelectorAll('.fkgo').forEach(x=>x.remove());return c.textContent};
const fkTitle=f=>`FK ${f.name}: ${f.cols.join(', ')} → ${f.rdb}.${f.rtable}(${f.rcols.join(', ')}) · ON DELETE ${f.on_delete} · ON UPDATE ${f.on_update}`;
const fkBtn=(f,j)=>`<button type="button" class="fkgo" data-fk="${j}" title="${esc('Abrir o registro em '+f.rtable+' ('+f.rcols.join(', ')+') — Ctrl+clique: nova aba\n'+fkTitle(f))}" aria-label="Abrir registro em ${esc(f.rtable)}">↗</button>`;
function fkMap(r,list){
  const m=new Map();
  for(const f of list){
    const idx=f.cols.map(c=>r.columns.indexOf(c));
    if(idx.includes(-1))continue;
    const o={...f,idx};idx.forEach(j=>{if(!m.has(j))m.set(j,o)});
  }
  return m;
}
/* SELECT simples de uma única tabela (sem JOIN, vírgula, função, alias de coluna ou GROUP BY):
   as colunas do resultado são colunas reais da tabela, então dá para ligar as FKs pelo nome. */
function simpleSelect(sql){
  const id='(?:`[^`]+`|[\\w$]+)',un=x=>x.replace(/`/g,''),clean=sql.replace(NOISE,' ').trim();
  const m=new RegExp(`^select\\s+(?:distinct\\s+)?([^()]+?)\\s+from\\s+(${id})(?:\\s*\\.\\s*(${id}))?\\s*(?:(where|order\\s+by|limit)\\b[\\s\\S]*)?;?$`,'i')
    .exec(clean);
  if(!m||/\bas\b/i.test(m[1])||clean.replace(/;\s*$/,'').includes(';')||/\b(join|union|group)\b/i.test(clean))return null;
  return{alias:S.alias,db:m[3]?un(m[2]):S.db,table:un(m[3]||m[2])};
}
function attachFks(t,r,src){   // só a tabela deste resultado; 1 consulta, em cache até invalidate()
  r.fkSrc=src;
  const e=entOf(src.alias,src.db),cache=e.fks,c=cache[src.table];
  if(c){r.fkmap=fkMap(r,c);return}
  api('/api/fks',{alias:src.alias,db:src.db,tables:[src.table]}).then(x=>{
    if(x.error||!x.fks)return;
    const list=x.fks[src.table]||[];
    if(e.fks===cache)cache[src.table]=list;
    if(!list.length)return;
    r.fkmap=fkMap(r,list);
    if(t===cur()&&t.results.includes(r)&&!t.results.some(y=>y.drafts||y.saving)){renderRes();hideRec()}
  });
}
const lit=v=>typeof v==='number'?String(v):"'"+String(v).replace(/\\/g,'\\\\').replace(/'/g,"''")+"'";
function fkGo(r,i,j,inNew){
  const f=r.fkmap?.get(j),src=r.fkSrc,t=cur();
  if(!f||!src||t.running)return;
  if(S.alias!==src.alias)return toast('Selecione a conexão '+src.alias);
  const vals=f.idx.map(k=>r.rows[i][k]);
  if(vals.some(v=>v===null))return toast('Valor NULL: não há registro para abrir');
  const sql=`SELECT * FROM ${bq(f.rdb)}.${bq(f.rtable)} WHERE ${f.rcols.map((c,k)=>bq(c)+' = '+lit(vals[k])).join(' AND ')} LIMIT 200;`;
  const next={sql,alias:src.alias,db:f.rdb,table:f.rtable};
  if(inNew){newTab(sql,f.rtable,true).fkNext=next;run();return}
  if(!replaceResults(t))return;
  t.results.forEach(x=>{x.drafts=null});

// O servidor aplica as mesmas regras antes de enviar cada instrução ao MySQL.
const SQL_TRIVIA=/([^\S\n]+|\n|--(?=[\x00-\x20\x7f]|$)[^\n]*|#[^\n]*|\/\*(?!!|M!)[\s\S]*?(?:\*\/|$))/iy;
const SQL_QUOTED=/'(?:[^'\\]|\\[\s\S]|'')*(?:'|\\?$)|"(?:[^"\\]|\\[\s\S]|"")*(?:"|\\?$)|\x60(?:[^\x60]|\x60\x60)*(?:\x60|$)/y;
const SQL_DIRECTIVE=/\/\*(?:!|M!)\d*\s*([\s\S]*?)(?:\*\/|$)/iy;
const SQL_DELIMITER=/[ \t]*delimiter(?=[ \t\r\n]|$)[ \t]*([^\r\n]*)(?:\r?\n|$)/iy;
const SQL_ROUTINE=/^(?:begin\s+not\s+atomic\b|create\s+(?:or\s+replace\s+)?(?:definer\s*=\s*[^\s@()]+(?:\s*@\s*[^\s@()]+|\s*\(\s*\))?\s+)?(?:aggregate\s+)?(?:procedure|function|trigger|event)\b)/i;
const SQL_PLAIN=/[^\s'"\x60#;/-]+/y;
class SqlParseError extends Error{}
function matchSql(pattern,sql,offset){
  pattern.lastIndex=offset;
  return pattern.exec(sql);
}
function sqlCommand(sql){
  let command='',start=0;
  for(let i=0;i<sql.length;){
    const trivia=matchSql(SQL_TRIVIA,sql,i);
    const quoted=!trivia&&matchSql(SQL_QUOTED,sql,i);
    const directive=!trivia&&!quoted&&matchSql(SQL_DIRECTIVE,sql,i);
    const token=trivia||quoted||directive;
    if(!token){i+=matchSql(SQL_PLAIN,sql,i)?.[0].length||1;continue}
    command+=sql.slice(start,i)+(trivia?' ':quoted?'?':' '+sqlCommand(directive[1])+' ');
    i+=token[0].length;
    start=i;
  }
  return (command+sql.slice(start)).trim();
}
function sqlStatements(sql){
  const ranges=[];
  let delimiter=';',from=-1,bodyEnd=0;
  function addStatement(to){
    if(from<0)return;
    // Um corpo sem delimitador próprio nunca deve virar uma série de comandos avulsos.
    if(delimiter===';'&&/^(?:begin\b|create\b|\/\*(?:!|M!))/i.test(sql.slice(from,from+8))&&
       SQL_ROUTINE.test(sqlCommand(sql.slice(from,bodyEnd)))){
      throw new SqlParseError('Use DELIMITER para executar a definição inteira da rotina');
    }
    ranges.push({from,bodyEnd,to,delimiter});
    from=-1;
  }
  for(let i=0;i<sql.length;){
    const change=(i===0||sql[i-1]==='\n')&&matchSql(SQL_DELIMITER,sql,i);
    if(change){
      const argument=change[1].trim();
      const quoted=/^(['"\x60])([^\r\n]*)\1$/.exec(argument);
      const value=quoted?quoted[2]:argument;
      if(from>=0||!/^[^\s\\'"\x60]+$/.test(value))throw new SqlParseError('DELIMITER inválido ou fora do início de uma instrução');
      delimiter=value;
      i+=change[0].length;
      continue;
    }
    if(sql.startsWith(delimiter,i)){
      addStatement(i+delimiter.length);
      i+=delimiter.length;
      continue;
    }
    const trivia=matchSql(SQL_TRIVIA,sql,i);
    if(trivia){i+=trivia[0].length;continue}
    if(from<0)from=i;
    const token=matchSql(SQL_QUOTED,sql,i)||matchSql(SQL_DIRECTIVE,sql,i)||
      (delimiter===';'&&matchSql(SQL_PLAIN,sql,i));
    i+=token?token[0].length:1;
    bodyEnd=i;
  }
  if(from>=0&&delimiter!==';')throw new SqlParseError('Falta o delimitador '+delimiter+' no fim da instrução');
  addStatement(bodyEnd);
  return ranges;
}

const MAX_AUTO_SQL=300000;
const parsedSql=new WeakMap();
function parseDoc(doc){
  let parsed=parsedSql.get(doc);
  if(parsed)return parsed;
  const folds=new Map();
  try{
    const ranges=sqlStatements(doc.toString());
    if(doc.length<=MAX_AUTO_SQL){
      for(const range of ranges){
        const first=doc.lineAt(range.from);
        if(range.to>first.to)folds.set(first.from,{from:first.to,to:range.to});
      }
    }
    parsed={ranges,folds};
  }catch(error){
    if(!(error instanceof SqlParseError))throw error;
    parsed={error,folds};
  }
  parsedSql.set(doc,parsed);
  return parsed;
}
function statementAt(doc,pos){
  const {ranges,error}=parseDoc(doc);
  if(error)throw error;
  const line=doc.lineAt(pos);
  let low=0,high=ranges.length;
  while(low<high){
    const mid=(low+high)>>>1;
    if(ranges[mid].from<=pos)low=mid+1;
    else high=mid;
  }
  const previous=ranges[low-1],next=ranges[low];
  if(previous&&previous.to>=line.from)return previous;
  if(next&&next.from<=line.to)return next;
  return previous||next||null;
}
function foldAt(doc,lineStart){
  return doc.length<=MAX_AUTO_SQL?parseDoc(doc).folds.get(lineStart)||null:null;
}

const {EditorState,StateEffect,StateField,EditorView,ViewPlugin,Decoration,keymap,lineNumbers,placeholder,
       defaultKeymap,history,historyKeymap,foldService,foldGutter,foldKeymap,foldedRanges,unfoldEffect,
       syntaxTree,syntaxHighlighting,HighlightStyle,MySQL,tags}=SqlEditor;
const tableNamesChanged=StateEffect.define();

  create:()=>new Set(),

    for(const effect of transaction.effects)if(effect.is(tableNamesChanged))names=effect.value;

  }

       update.startState.field(tableNames)!==update.state.field(tableNames)){

    const {state,visibleRanges}=view,names=state.field(tableNames),marks=[];

        let name=state.sliceDoc(node.from,node.to);
        if(node.name==='QuotedIdentifier')name=name.slice(1,-1).replace(/``/g,'`');
        if(names.has(name.toLowerCase()))marks.push(tableMark.range(node.from,node.to));

const editorExtensions=[
  EditorView.domEventHandlers({keydown:editorKeydown,mousedown:acClose,scroll:acClose,blur:acClose}),
  MySQL.language,tableNames,tableHighlight,history(),keymap.of([...defaultKeymap,...historyKeymap,...foldKeymap]),
  lineNumbers(),foldGutter({

  foldService.of((state,from)=>foldAt(state.doc,from)),
  EditorState.transactionExtender.of(tr=>{
    if(!tr.docChanged)return null;

  placeholder('SELECT * FROM tabela LIMIT 100;'),

// Trecho de SQL só para leitura, com as mesmas cores do editor (usado no painel do plano).
function codeView(parent,doc){

// Ctrl+Shift+F: formata a seleção ou, sem seleção, a consulta sob o cursor (desfaz com Ctrl+Z).
function formatSql(){
  const {doc,selection}=editor.state,{from,to,empty}=selection.main;
  let a=from,b=to;
  try{
    if(empty){
      const st=statementAt(doc,from);if(!st)return toast('Nenhuma consulta para formatar');
      if(st.delimiter!==';')return toast('Formatação não disponível em blocos com DELIMITER');
      a=st.from;b=st.bodyEnd;
    }
  }catch(error){if(!(error instanceof SqlParseError))throw error;return toast(error.message)}
  const src=doc.sliceString(a,b);
  if(/^\s*(?:delimiter\b|begin\b|create\s+(?:or\s+replace\s+)?(?:definer\s*=\s*\S+\s+)?(?:aggregate\s+)?(?:procedure|function|trigger|event)\b)/i.test(src))
    return toast('Formatação não disponível para procedures, funções, triggers e eventos');

  if(!out||lead+out+tail===src)return toast('Já está formatado');
  const ins=lead+out+tail;
  editor.dispatch({changes:{from:a,to:b,insert:ins},selection:empty?{anchor:a+lead.length}:{anchor:a,head:a+ins.length},userEvent:'input.format',scrollIntoView:true});
  editor.focus();
}
function setSql(doc){
  const tab=cur();
  if(tab.editorState?.doc.toString()!==doc)tab.editorState=EditorState.create({doc,extensions:editorExtensions});
  const activeNames=editor.state.field(tableNames);
  if(tab.editorState.field(tableNames)!==activeNames){

function editorKeydown(e){

  }
  if(e.key==='Escape'&&cur()?.running){
    e.preventDefault();acClose();cancelRun();return true;
  }
  const modified=e.ctrlKey||e.metaKey;
  if(modified&&e.key==='Enter'||e.key==='F5'){
    e.preventDefault();acClose();run(e.key==='Enter'&&e.shiftKey);return true;
  }
  if(modified&&e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='f'){
    e.preventDefault();acClose();formatSql();return true;
  }
  if(modified&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='e'){
    e.preventDefault();acClose();explain();return true;
  }
  if(modified&&e.code==='Space'){
    e.preventDefault();acUpdate(true);return true;
  }
  if(AC.open){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();acMove(e.key==='ArrowDown'?1:-1);return true;
    }

      e.preventDefault();acAccept(AC.sel);return true;
    }

}

const KW=new Set('select from where and or not in is null like between exists case when then else end as on join inner left right outer cross natural using group by order having limit offset union all distinct insert into values update set delete create alter drop truncate table index view database schema if default primary key foreign references unique constraint add column modify change rename to show describe desc asc explain use begin commit rollback start transaction call with recursive over partition interval true false div mod xor regexp rlike binary collate charset engine auto_increment unsigned signed temporary replace ignore duplicate for lock share straight_join full tables databases columns status variables processlist grants'.split(' '));

const ICON={table:'T',col:'C',kw:'K',fn:'ƒ',db:'D'};

const ck=db=>S.alias+'|'+db;
const entOf=(alias,db)=>S.cache[alias+'|'+db]||(S.cache[alias+'|'+db]={cols:{},pend:new Set(),names:null,fks:{}});
const ent=db=>entOf(S.alias,db);
function tnames(db){   // lower -> nome real, a partir de SHOW FULL TABLES (já carregado)

let colTimer=null;const colQueue=new Map();

function colsOf(db,table){

const NOISE=/--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/g;

function acCandidates(state,pos,force){

/* ---------- formatar SQL (Ctrl+Shift+F; testado em tests/format.test.cjs) ---------- */
// Formatador leve, sem dependências: quebra linha antes de cada cláusula, uma coluna por linha
// no SELECT com várias colunas, AND/OR do WHERE em linhas próprias e subqueries indentadas.
// Textos entre aspas, identificadores e comentários saem exatamente como entraram.
const SqlFormat=(()=>{
const KW=new Set(('select from where and or not in is null like between exists case when then else end as on join inner left right outer '+
  'cross natural using group by order having limit offset union all distinct insert into values update set delete with recursive over '+
  'partition asc desc interval true false regexp rlike straight_join window replace ignore duplicate key lateral rows range unbounded '+
  'preceding following current row escape div mod xor collate binary for share lock nowait skip locked intersect except returning rollup '+
  'high_priority low_priority sql_calc_found_rows sql_no_cache delayed quick').split(' '));
const CLAUSE=['on duplicate key update','lock in share mode','insert ignore into','insert into','replace into','delete from','with recursive',
  'select','from','where','group by','order by','having','limit','window','union all','union distinct','union','intersect','except',
  'values','set','update','with','returning','for update','for share'];
const JOINS=['left outer join','right outer join','inner join','left join','right join','cross join','natural join','straight_join','join'];
const MODS=new Set(['distinct','all','sql_calc_found_rows','sql_no_cache','high_priority','straight_join','distinctrow']);
const CMP=new Set(['=','<>','!=','<=','>=','<','>',':=','<=>']);
const LEX=/(\s+)|(--(?=\s|$)[^\n]*|#[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^'\\]|\\[\s\S]|'')*'?|"(?:[^"\\]|\\[\s\S]|"")*"?)|(`(?:[^`]|``)*`?)|(0x[0-9a-f]+\b|\d+(?:\.\d+)?(?:e[+-]?\d+)?|\.\d+)|(@@?[\w$.]*|[\w$\u0080-￿]+)|(<=>|<>|!=|<=|>=|:=|\|\||&&|->>|->|[\s\S])/giy;
const TYPES=[null,'ws','comment','str','id','num','word','op'];
function lex(src){
  const out=[];let sp=false,nl=false,m;LEX.lastIndex=0;
  while(LEX.lastIndex<src.length&&(m=LEX.exec(src))){
    const type=TYPES[m.findIndex((g,i)=>i&&g!==undefined)];
    if(type==='ws'){sp=true;nl=nl||m[0].includes('\n');continue}
    out.push({type,v:m[0],sp,nl:nl||!out.length,pos:m.index});sp=nl=false;
  }
  return out;
}
function format(src){
  const T=lex(src);let out='',pend=null,prev=null;

  const lw=t=>t&&t.type==='word'?t.v.toLowerCase():'';
  const lineIndent=()=>{const m=/(?:^|\n)( *)[^\n]*$/.exec(out);return m?m[1].length>>1:0};
  const newline=n=>{out=out.replace(/[ \t]+$/,'');if(out)out+='\n';out+='  '.repeat(n)};

    for(const p of list){const ws=p.split(' ');if(ws.every((w,j)=>lw(T[k+j])===w))return p}
    return null;
  }

      else if(!d&&t.v===',')n++;else if(!d&&t.type==='word'&&(phrase(j,CLAUSE)||phrase(j,JOINS)||lw(t)==='into'))break;}

  }

        (t.v==='('&&!t.sp&&(p.type==='word'||p.type==='id'));
      if(!glue&&(t.sp||CMP.has(t.v)||CMP.has(p.v)||p.v===','||(t.type!=='op'&&p.type!=='op')))out+=' ';

    }

// coluna ou tabela, com ou sem qualificador: c | t.c | `t`.`c`
function ref(T,i){
  const a=T[i];if(!isName(a)||T[i-1]?.v==='.')return null;
  if(T[i+1]?.v==='.'&&isName(T[i+2]))return {q:unq(a),c:unq(T[i+2]),i0:i,i1:i+3};
  return {q:null,c:unq(a),i0:i,i1:i+1};
}
const txt=(sql,T,a,b)=>sql.slice(T[a].pos,T[b].end);   // texto original dos tokens a..b
const apply=(sql,E)=>{let s=sql;for(const e of [...E].sort((a,b)=>b.from-a.from))s=s.slice(0,e.from)+e.text+s.slice(e.to);return s};
function nextDay(lit){
  const m=/^'(\d{4})-(\d{2})-(\d{2})'$/.exec(lit);if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  if(d.getUTCDate()!==+m[3]||d.getUTCMonth()!==+m[2]-1)return null;   // data inválida
  d.setUTCDate(d.getUTCDate()+1);return `'${d.toISOString().slice(0,10)}'`;
}

/* 1. DATE(col) = 'AAAA-MM-DD', DATE(col) BETWEEN …, YEAR(col) = AAAA  ->  faixa sobre a coluna */
function sargable(sql,T){
  const E=[],cols=[];
  for(let i=0;i<T.length;i++){
    const f=lw(T[i]);if(f!=='date'&&f!=='year'||T[i+1]?.v!=='('||T[i-1]?.v==='.')continue;
    const c=ref(T,i+2);if(!c||T[c.i1]?.v!==')')continue;
    const col=txt(sql,T,c.i0,c.i1-1),j=c.i1+1,op=T[j],a=T[j+1];
    let to=null,lo,hi;
    if(f==='date'&&op?.v==='='&&a?.type==='str'&&nextDay(a.v)){lo=a.v;hi=nextDay(a.v);to=j+1}
    else if(f==='date'&&lw(op)==='between'&&a?.type==='str'&&lw(T[j+2])==='and'&&T[j+3]?.type==='str'&&nextDay(a.v)&&nextDay(T[j+3].v)){lo=a.v;hi=nextDay(T[j+3].v);to=j+3}
    else if(f==='year'&&op?.v==='='&&a?.type==='num'&&/^\d{4}$/.test(a.v)){lo=`'${a.v}-01-01'`;hi=`'${+a.v+1}-01-01'`;to=j+1}
    if(to==null)continue;
    E.push({from:T[i].pos,to:T[to].end,text:`(${col} >= ${lo} AND ${col} < ${hi})`});cols.push(col);i=to;
  }
  if(!E.length)return null;
  return {id:'sarg',title:'Filtrar a coluna, não a função',sql:apply(sql,E),
    why:`${[...new Set(cols)].join(', ')} estava dentro de DATE()/YEAR(). Assim o MySQL calcula a função em cada linha e não usa índice. A faixa equivalente deixa o índice da coluna ser usado.`,
    caveat:'Equivalente para colunas DATE, DATETIME e TIMESTAMP. O ganho só aparece se a coluna tiver índice.'};
}

/* 2. Subquery correlacionada com agregação  ->  LEFT JOIN com a agregação pré-calculada */
// x > (SELECT AVG(c.v) FROM t c WHERE c.k = o.k [AND …])  vira
// LEFT JOIN (SELECT c.k AS k, AVG(c.v) AS v FROM t c [WHERE …] GROUP BY c.k) sq1 ON sq1.k = o.k
// O GROUP BY garante no máximo uma linha por chave (o JOIN não duplica linhas) e o LEFT JOIN
// devolve NULL onde a subquery devolveria NULL; para COUNT, que devolve 0, entra COALESCE.
function aggSub(sql,T,s,e){
  const D=T[s].d;let i=s+1;   // profundidade de dentro dos parênteses
  const agg=lw(T[i]);if(!AGG.has(agg)||T[i+1]?.v!=='(')return null;
  const ac=T[i+1].match;if(ac==null||ac>=e)return null;
  const aggText=txt(sql,T,i,ac);i=ac+1;
  if(lw(T[i])==='as')i+=2;else if(isName(T[i])&&lw(T[i])!=='from')i++;
  if(lw(T[i])!=='from')return null;
  const tb=ref(T,i+1);if(!tb)return null;i=tb.i1;
  let alias=null;
  if(lw(T[i])==='as'){alias=unq(T[i+1]);i+=2}else if(isName(T[i])&&lw(T[i])!=='where'){alias=unq(T[i]);i++}
  const from=txt(sql,T,tb.i0,i-1);
  if(lw(T[i])!=='where')return null;
  const inner=(alias||tb.c).toLowerCase(),parts=[];let st=++i;
  for(let j=i;j<=e;j++){
    const t=T[j];
    if(j===e||t.d===D&&lw(t)==='and'){if(j===st)return null;parts.push([st,j-1]);st=j+1;continue}
    if(t.d===D&&(t.v===','||['or','between','group','order','limit','having','union','join','xor'].includes(lw(t))))return null;
  }
  let corr=null;const rest=[];
  for(const [a,b] of parts){
    const L=ref(T,a),R=L&&T[L.i1]?.v==='='?ref(T,L.i1+1):null;
    if(L&&R&&R.i1===b+1&&L.q&&R.q&&(L.q.toLowerCase()===inner)!==(R.q.toLowerCase()===inner)){
      if(corr)return null;
      corr=L.q.toLowerCase()===inner?{k:L,o:R}:{k:R,o:L};continue;
    }
    // as outras condições não podem citar tabelas de fora
    for(let j=a;j<=b;j++)if(isName(T[j])&&T[j+1]?.v==='.'&&unq(T[j]).toLowerCase()!==inner)return null;
    rest.push(txt(sql,T,a,b));
  }
  for(let j=s+1;j<ac;j++)if(isName(T[j])&&T[j+1]?.v==='.'&&unq(T[j]).toLowerCase()!==inner)return null;
  if(!corr)return null;
  return {agg,aggText,from,rest:rest.join(' AND '),key:txt(sql,T,corr.k.i0,corr.k.i1-1),outer:txt(sql,T,corr.o.i0,corr.o.i1-1)};
}
function correlated(sql,T,P){
  let dep=false;C.walk(P.root,n=>{if(n.kind==='block'&&n.dependent&&n.sub)dep=true});
  if(!dep||lw(T[0])!=='select'||T.some(t=>t.d===0&&['union','into'].includes(lw(t))))return null;
  const top=k=>T.findIndex(t=>t.d===0&&lw(t)===k),iFrom=top('from'),iWhere=top('where');
  if(iFrom<0)return null;
  const ENDS=['where','group','having','order','limit','window','for','lock'];
  const iEnd=T.findIndex((t,i)=>i>iFrom&&t.d===0&&(ENDS.includes(lw(t))||t.v===';'));
  const at=iEnd<0?sql.length:T[iEnd].pos;
  const wEnd=iWhere<0?-1:(k=>k<0?T.length:k)(T.findIndex((t,i)=>i>iWhere&&t.d===0&&(ENDS.includes(lw(t))||t.v===';')));
  const used=new Set(T.filter(isName).map(t=>unq(t).toLowerCase()));
  const E=[],J=[];let n=0;
  for(let i=0;i<T.length;i++){
    const t=T[i];
    if(t.v!=='('||t.d!==0||lw(T[i+1])!=='select'||t.match==null)continue;
    if(!(i<iFrom||iWhere>=0&&i>iWhere&&i<wEnd))continue;   // só no SELECT ou no WHERE
    const r=aggSub(sql,T,i+1,t.match);if(!r)continue;
    let a;do{a='sq'+(++n)}while(used.has(a));
    E.push({from:t.pos,to:T[t.match].end,text:r.agg==='count'?`COALESCE(${a}.v, 0)`:`${a}.v`});
    J.push(`LEFT JOIN (SELECT ${r.key} AS k, ${r.aggText} AS v FROM ${r.from}${r.rest?' WHERE '+r.rest:''} GROUP BY ${r.key}) ${a} ON ${a}.k = ${r.outer}`);
    i=t.match;
  }
  if(!E.length)return null;
  E.push({from:at,to:at,text:iEnd<0?' '+J.join(' '):J.join(' ')+' '});
  return {id:'corr',title:'Subquery correlacionada vira JOIN',sql:apply(sql,E),
    why:`A subquery rodava uma vez para cada linha da consulta de fora. Na versão nova, a agregação é calculada uma vez por chave (GROUP BY) e ligada com LEFT JOIN, que devolve o mesmo resultado.`};
}

/* 3. Coluna de texto comparada com número (aviso 1739 do servidor)  ->  número entre aspas */
function conversion(sql,T,notes){
  const F=new Set();
  for(const n of notes||[]){const m=n[1]===1739&&/on field '([^']+)'/.exec(n[2]);if(m)F.add(m[1].toLowerCase())}
  if(!F.size)return null;
  const E=[],cols=new Set(),q=t=>({from:t.pos,to:t.end,text:`'${t.v}'`});
  for(let i=0;i<T.length;i++){
    const c=ref(T,i);if(!c||!F.has(c.c.toLowerCase()))continue;
    const j=c.i1;
    if(T[j]?.v==='='&&T[j+1]?.type==='num'){E.push(q(T[j+1]));cols.add(c.c)}
    else if(lw(T[j])==='in'&&T[j+1]?.v==='('&&T[j+1].match!=null){
      const e=T[j+1].match,ns=[];let ok=true;
      for(let k=j+2;k<e;k++){if(T[k].type==='num')ns.push(q(T[k]));else if(T[k].v!==',')ok=false}
      if(ok&&ns.length){E.push(...ns);cols.add(c.c)}
    }
    i=c.i1-1;
  }
  if(!E.length)return null;
  return {id:'conv',title:'Comparar texto com texto',sql:apply(sql,E),
    why:`${[...cols].join(', ')} é texto e estava sendo comparado com número: o MySQL converte o valor de cada linha e não usa o índice (aviso 1739 do servidor).`,
    caveat:'Como número, "0123" e "123" são iguais; como texto, não. Confira se os valores não têm zeros à esquerda nem espaços.'};
}

/* 4. Ordem do JOIN: alternativas forçadas com o hint JOIN_ORDER (MySQL 8.0+) */
// O otimizador escolhe a ordem de menor custo ESTIMADO; quando a estimativa erra (filtro sem
// índice nem histograma, dados desbalanceados), outra ordem pode ser bem mais rápida. Estas
// alternativas não ganham no EXPLAIN (o otimizador já preferiu a dele): só a medição real decide.
function topJoin(P){
  let n=P.root.children.find(c=>!c.sub);
  while(n&&n.kind==='op')n=n.children.find(c=>!c.sub);
  return n?.kind==='nl'&&n.children.every(c=>c.kind==='table')?n:null;
}
const hintName=t=>/^[A-Za-z_$][\w$]*$/.test(t)?t:'`'+t.replace(/`/g,'``')+'`';
function joinOrders(sql,T,P,server){
  if(server&&(server.flavor!=='MySQL'||parseInt(server.version)<8))return [];
  const nl=topJoin(P);if(!nl||nl.children.length>5||lw(T[0])!=='select'||T[1]?.type==='comment'||/\/\*\+/.test(sql))return [];
  const cur=nl.children.map(c=>c.title),first=nl.children[0],out=[];
  if(T.some(t=>t.d===0&&lw(t)==='union'))return [];
  const why=(c)=>{
    const {eq,rg}=C.condCols(c),f=[...eq,...rg];
    return `Hoje o MySQL começa por ${C.realName(P,first)} (${C.fmtN(first.est.scan)} linhas lidas${first.access==='ALL'?', varredura completa':''}) e busca as outras tabelas para cada linha. `+
      (f.length?`${C.realName(P,c)} tem filtro próprio (${f.join(', ')}): começando por ela, o JOIN pode partir de menos linhas.`:`Começar por ${C.realName(P,c)} muda o lado que dirige o JOIN.`)+
      (c.est.filtered!=null&&GUESSY(c.est.filtered)?` O filtered dela (${C.nf.format(c.est.filtered)}%) é um chute do MySQL, então a estimativa pode estar errada.`:'');
  };
  // candidatas: cada tabela com filtro próprio vai para a frente; com 2 tabelas, a ordem inversa
  const cands=nl.children.slice(1).filter(c=>{const {eq,rg}=C.condCols(c);return eq.length||rg.length});
  if(nl.children.length===2&&!cands.length)cands.push(nl.children[1]);
  for(const c of cands.slice(0,3)){
    const order=[c.title,...cur.filter(t=>t!==c.title)];
    out.push({id:'order:'+order.join(','),kind:'hint',expect:order,title:`Começar o JOIN por ${C.realName(P,c)}`,
      sql:sql.slice(0,T[0].end)+` /*+ JOIN_ORDER(${order.map(hintName).join(', ')}) */`+sql.slice(T[0].end),
      why:why(c),caveat:'Só muda a ordem de leitura, o resultado é o mesmo. O hint JOIN_ORDER é ignorado em versões antigas.'});
  }

}
const GUESSY=f=>[10,33.33,11.11,1,3.33,3.7,1.23,11.11].some(g=>Math.abs(f-g)<.01);
function rewrites(sql,P,notes,server){
  const T=prep(sql);if(!T.length)return [];
  return [correlated(sql,T,P),sargable(sql,T),conversion(sql,T,notes),...joinOrders(sql,T,P,server)].filter(Boolean);
}

/* Conselhos que dependem do texto da consulta (entram nos diagnósticos, sem validação) */
function advice(sql,P){
  const T=prep(sql),I=[],top=k=>T.findIndex(t=>t.d===0&&lw(t)===k);
  // OFFSET grande: LIMIT a, b  ou  LIMIT b OFFSET a
  const iL=top('limit');
  if(iL>=0){
    let off=null,cnt=null;const A=T[iL+1],B=T[iL+3];
    if(A?.type==='num'&&T[iL+2]?.v===','&&B?.type==='num'){off=+A.v;cnt=+B.v}
    else if(A?.type==='num'&&lw(T[iL+2])==='offset'&&B?.type==='num'){off=+B.v;cnt=+A.v}
    if(off>=10000){
      const iO=top('order'),o=iO>=0&&lw(T[iO+1])==='by'?ref(T,iO+2):null;
      const one=o&&(!T[o.i1]||T[o.i1].v===';'||['asc','desc','limit'].includes(lw(T[o.i1])));
      const col=one?txt(sql,T,o.i0,o.i1-1):'<coluna única do ORDER BY>',desc=one&&lw(T[o.i1])==='desc';
      I.push({sev:'md',n:P.root,t:`OFFSET de ${C.fmtN(off)} linhas`,p:`O MySQL lê e descarta ${C.fmtN(off)} linhas antes de devolver as ${C.fmtN(cnt)} pedidas, e cada página seguinte fica mais lenta.`,
        fix:{sql:`-- guarde o último valor de ${col} da página anterior\nWHERE ${col} ${desc?'<':'>'} :ultimo_valor\nORDER BY ${col}${desc?' DESC':''}\nLIMIT ${cnt}`,why:'Paginação por chave: cada página continua de onde a anterior parou e lê só as linhas que devolve. Precisa de um ORDER BY por coluna única e indexada.'}});
    }
  }
  // ORDER BY … LIMIT com filesort numa tabela só: índice com o WHERE e o ORDER BY
  const tables=[];C.walk(P.root,n=>{if(n.kind==='table')tables.push(n)});
  const sort=[];C.walk(P.root,n=>{if(n.kind==='op'&&n.title==='ORDER BY'&&n.flags.includes('filesort'))sort.push(n)});
  const iO=top('order');
  if(tables.length===1&&sort.length&&iL>=0&&iO>=0&&lw(T[iO+1])==='by'){
    const t=tables[0],cols=[];let dir=null,ok=true;
    for(let i=iO+2;i<iL;){
      const r=ref(T,i);if(!r||r.q&&r.q.toLowerCase()!==String(t.title).toLowerCase()){ok=false;break}
      let d='asc',j=r.i1;if(['asc','desc'].includes(lw(T[j]))){d=lw(T[j]);j++}
      if(dir&&d!==dir){ok=false;break}dir=d;cols.push(r.c);
      if(T[j]?.v===',')j++;else if(j!==iL){ok=false;break}
      i=j;
    }
    if(ok&&cols.length){
      const tn=C.realName(P,t),eq=C.condCols(t).eq,all=[...eq,...cols.filter(c=>!eq.includes(c))];
      I.push({sev:'md',n:sort[0],t:`Índice para ORDER BY … LIMIT em ${tn}`,p:`Com um índice na ordem pedida, o MySQL lê só as primeiras linhas e para no LIMIT, sem ordenar ${C.fmtN(t.est.rows)} linhas.`,
        fix:{sql:`CREATE INDEX ix_${tn}_${all.join('_')}\n  ON ${tn} (${all.join(', ')});`,why:'Colunas de igualdade do WHERE primeiro, depois as do ORDER BY na mesma ordem. Confira os índices que já existem antes de criar.'}});
    }
  }
  return I;
}
return {rewrites,advice,prep,topJoin};

/* --- desenho --- */
const ew=r=>r==null?1.5:Math.min(8,1.4+1.5*Math.log10(r+1));
// Toda seta termina subindo (dir 'u') ou indo para a direita (dir 'r'); a ponta é um triângulo

function arrow(pts,dir,c,cls=''){

  const end=dir==='u'?[tx,ty+L]:[tx-L,ty];

  const head=dir==='u'?`M${tx},${ty} L${tx-hw},${ty+L} L${tx+hw},${ty+L}Z`:`M${tx},${ty} L${tx-L},${ty-hw} L${tx-L},${ty+hw}Z`;
  return `<path class="${k}" d="${d}" stroke-width="${w}"/><path class="${k} pv-ah" d="${head}"/>`;
}
function pill(x,y,txt,hot){const w=txt.length*6+12;return `<g transform="translate(${x},${y})"><rect class="pv-pill" x="${-w/2}" y="-9" width="${w}" height="18" rx="9"${hot?' style="stroke:var(--a-red)"':''}/><text class="pv-pillt" text-anchor="middle" y="4">${h(txt)}</text></g>`}
const rowsLabel=c=>{const r=C.outRows(c);return r==null?'':C.fmtN(r)+(r===1?' linha':' linhas')};
function draw(){
  const {P,st}=E,VG=C.VG,D=C.SZ.nl[1];let e='',nd='',fr='';
  for(const f of P.frames)fr+=`<rect class="pv-frame" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="12"/><text class="pv-framet" x="${f.x+12}" y="${f.y+15}">${h(f.n.frame)}</text>`;
  const R=D/2;   // meia diagonal do losango: os vértices ficam a R do centro
  for(const n of P.nodes){
    if(n.kind==='nl'){
      const d=n._d;
      n.children.forEach((c,i)=>{
        if(i===0)e+=arrow([[c.x,c.y],[c.x,d[0].y],[d[0].x-R,d[0].y]],'r',c);
        else e+=arrow([[c.x,c.y],[c.x,d[i-1].y+R]],'u',c);
        e+=pill(c.x,c.y-VG/2,rowsLabel(c));
      });
      for(let i=1;i<d.length;i++){e+=arrow([[d[i-1].x+R,d[i-1].y],[d[i].x-R,d[i].y]],'r',n.children[i]);e+=pill((d[i-1].x+d[i].x)/2,d[i].y+17,rowsLabel(n.children[i]))}
    }else n.children.forEach(c=>{
      const px=n.x,pb=n.y+n.h,cx=c.x,cy=c.y,my=(cy+pb)/2;
      e+=arrow(cx===px?[[cx,cy],[px,pb]]:[[cx,cy],[cx,my],[px,my],[px,pb]],'u',c,c.sub?' sub':'');
      const runs=c.dependent&&C.outRows(n);
      e+=pill(cx,c.frame?cy-VG+14:cy-VG/2+4,c.dependent?(runs?'executa ×'+C.fmtN(runs):'executa por linha'):c.sub?'subquery':c.edge||rowsLabel(c),c.dependent);
    });
    nd+=nodeSvg(n);
  }
  q('.pv-vp').innerHTML=fr+e+nd;
  q('.pv-leg').innerHTML=st.color==='heat'?'<b>% do custo estimado</b><div class="pv-heat"></div><div class="pv-lr"><span>baixo</span><span>alto</span></div>'
    :[['blue','Linha única (const)'],['green','Busca por chave'],['yellow','Full-text'],['orange','Faixa de índice'],['red','Varredura completa']].map(([c,t])=>`<span><i style="background:var(--a-${c})"></i>${t}</span>`).join('');
  mini();if(E.st.V)view();
}

// "/* select#1 */ select `app`.`t`.`c` ..." -> SQL formatado e sem o nome do banco repetido
function rewritten(r){

  if(r.db)s=s.split('`'+r.db.replace(/`/g,'``')+'`.').join('');

}
const insHtml=x=>`<div class="pv-tip2" style="--sev:var(--a-${SEV[x.sev]})"><b>${h(x.t)}</b><br>${h(x.p)}${x.fix?`${code(x.fix.sql,'índice')}<span class="pv-mt">${h(x.fix.why)}</span>`:''}</div>`;
// Faixa de diagnósticos: recolhida (só ícone e título) ou aberta (com os detalhes). Fica lembrado.

  b.innerHTML=tg+R.map(x=>`<div class="pv-ic pv-rwc" style="--sev:var(--a-green)" title="Ver a consulta reescrita"><span class="pv-sv">✓</span><div><b>${h(x.title)}</b><p>${realWin(x)?`Tempo real ${fmtMs(x.real.before)} → ${fmtMs(x.real.after)} (${pct(x.real.before,x.real.after)}), medido com EXPLAIN ANALYZE.`:`Custo estimado ${C.fmtN(x.before)} → ${C.fmtN(x.after)} (${gain(x)}), conferido com EXPLAIN.`}</p><p class="pv-go">Ver consulta reescrita →</p></div></div>`).join('')+I.map((x,k)=>`<div class="pv-ic" style="--sev:var(--a-${SEV[x.sev]})" data-k="${k}" title="${h(x.p)}"><span class="pv-sv">${x.sev==='hi'?'!':x.sev==='md'?'▲':'i'}</span><div><b>${h(x.t)}</b><p>${h(x.p)}</p>${x.fix?'<p class="pv-go">Ver sugestão →</p>':''}</div></div>`).join('');
