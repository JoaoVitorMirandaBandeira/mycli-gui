<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>my — MySQL</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{--bg:#fff;--bg2:#f4f5f7;--bg3:#e9ebef;--fg:#1c2330;--mut:#6b7585;--line:#d9dde4;--acc:#2f6fed;--accfg:#fff;--err:#c62828;--ok:#2e9e5b;--warn:#c77d00;--sel:#dbe7ff;--nul:#98a1b0;--zebra:#f9fafb;--tk:#b5179e;--ts:#2e7d32;--tn:#b45309;--tc:#8a94a3;--tf:#0369a1;--ti:#8a5a00;--tb:#00796b}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--bg2:#1b1f26;--bg3:#262c36;--fg:#e4e8ee;--mut:#8b95a5;--line:#2c323c;--acc:#5b92ff;--accfg:#0b1220;--err:#ff7b72;--ok:#4cc38a;--warn:#e3a33b;--sel:#26385e;--nul:#5f6877;--zebra:#171b21;--tk:#ff79c6;--ts:#a5d6a7;--tn:#f2a65a;--tc:#6b7585;--tf:#7dcfff;--ti:#e0af68;--tb:#5fd3c3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.mono,#sql,table.g,.kv,.q{font-family:ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;font-size:13px}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b.logo{font-size:15px;letter-spacing:.5px;margin-right:4px}
select,input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:-1px}
button{cursor:pointer;background:var(--bg3)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
kbd{font:11px ui-monospace,monospace;background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
button.pri kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.8}
.sp{flex:1}
#st{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;max-width:42ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st i{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
#st.ok i{background:var(--ok)}#st.err i{background:var(--err)}#st.err{color:var(--err)}#st.warn i{background:var(--warn)}
#db{width:200px}
#main{flex:1;display:flex;min-height:0}
aside{background:var(--bg2);display:flex;flex-direction:column;min-height:0}
#side{width:250px;border-right:1px solid var(--line)}
#side.hide{display:none}
#side input{margin:8px;width:calc(100% - 16px)}
#tables{list-style:none;margin:0;padding:0 0 8px;overflow:auto;flex:1}
#tables li{display:flex;align-items:center;padding:3px 10px;cursor:pointer;white-space:nowrap}
#tables li:hover{background:var(--bg3)}
#tables .n{flex:1;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace;font-size:12.5px}
#tables li.view .n{font-style:italic;color:var(--mut)}
#tables i{font-style:normal;color:var(--mut);padding:0 4px;border-radius:4px;visibility:hidden}
#tables li:hover i{visibility:visible}#tables i:hover{background:var(--line);color:var(--fg)}
#cnt{padding:4px 10px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
#work{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--bg2);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px 6px 0 0;cursor:pointer;color:var(--mut);white-space:nowrap;max-width:220px}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:var(--bg3)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--acc)}
.tab b{font-weight:400;opacity:.5}.tab b:hover{opacity:1;color:var(--err)}
#ed{position:relative;height:150px;min-height:56px;resize:vertical;overflow:hidden;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
#ed:focus-within{box-shadow:inset 0 0 0 2px var(--acc)}
#hlight,#sql{position:absolute;inset:0;margin:0;padding:10px 14px;border:0;border-radius:0;font:13px/1.5 ui-monospace,"JetBrains Mono","DejaVu Sans Mono",Menlo,monospace;white-space:pre;tab-size:2;overflow:auto;letter-spacing:0;font-variant-ligatures:none;font-kerning:none}
#hlight{overflow:hidden;pointer-events:none;color:var(--fg)}
#sql{background:transparent;color:transparent;caret-color:var(--fg);resize:none;outline:none!important;box-shadow:none!important}
#sql::selection{background:rgba(91,146,255,.38);color:transparent}
#sql::placeholder{color:var(--mut)}
.tk{color:var(--tk)}.ts{color:var(--ts)}.tn{color:var(--tn)}.tc{color:var(--tc)}.tf{color:var(--tf)}.ti{color:var(--ti)}.tb{color:var(--tb)}
#ac{position:fixed;display:none;z-index:60;min-width:260px;max-width:520px;max-height:288px;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0006;padding:3px}
.ai{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:5px;cursor:pointer;white-space:nowrap}
.ai.on{background:var(--acc);color:var(--accfg)}
.ai .lb{font-family:ui-monospace,monospace;font-size:13px}
.ai small{margin-left:auto;padding-left:14px;opacity:.65;font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:18px;height:18px;border-radius:4px;font:700 11px/18px ui-monospace,monospace;text-align:center;color:#fff}
.ic.table{background:#2e8b8b}.ic.col{background:#4a7bd8}.ic.kw{background:#a04fb5}.ic.fn{background:#c47a1a}.ic.db{background:#5c6b7a}
.sh{display:flex;align-items:center;gap:4px;padding-right:8px}
.sh input{flex:1;min-width:0}
.sh button{padding:3px 8px}
#res{flex:1;overflow:auto;min-height:0}
.msg{padding:28px;color:var(--mut);text-align:center}
.err{margin:12px;padding:10px 14px;border-left:4px solid var(--err);background:var(--bg2);color:var(--err);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}
.blk{margin-bottom:6px}
.bh{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.bh .q{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto;max-width:45%}
.bh .meta{white-space:nowrap;font-size:12.5px;color:var(--mut)}
.bh .meta b{color:var(--warn)}
.bh .f{width:170px;padding:3px 8px}
.bh button{padding:3px 10px}
.blk.ok .meta{color:var(--ok)}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
table.g th{position:sticky;top:36px;z-index:2;background:var(--bg3);text-align:left;padding:5px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;font-weight:600}
table.g th:hover{color:var(--acc)}
table.g td{padding:3px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis}
table.g tr:nth-child(even) td{background:var(--zebra)}
table.g tr:hover td{background:var(--bg3)}
table.g tr.sel td{background:var(--sel)}
td.rn,th.rn{color:var(--mut);text-align:right;width:1%;background:var(--bg2)!important;cursor:default;position:sticky;left:0}
th.rn{z-index:4}
td.num{text-align:right}
table.g td.changed{box-shadow:inset 3px 0 var(--warn)}
table.g td.can-edit{cursor:text}
.cell-value{display:block;width:100%;border:0;border-radius:0;background:transparent;color:inherit;padding:0;text-align:inherit;overflow:hidden;text-overflow:ellipsis}
.cell-value:hover{text-decoration:underline;text-decoration-color:var(--acc)}
.cell-editor{display:flex;gap:4px;align-items:center}
.cell-editor textarea{min-width:140px;width:100%;padding:3px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px}
.cell-editor button{padding:3px 6px}
.nul{color:var(--nul);font-style:italic}
.rec{margin:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rh{padding:5px 12px;background:var(--bg3);font-weight:600;display:flex;align-items:center}
.kv{width:100%;border-collapse:collapse}
.kv th{width:1%;white-space:nowrap;text-align:right;vertical-align:top;color:var(--acc);padding:2px 12px;font-weight:600}
.kv td{padding:2px 12px;white-space:pre-wrap;word-break:break-word;cursor:copy}
.kv tr:hover td{background:var(--bg3)}
#rec{width:360px;border-left:1px solid var(--line);overflow:auto;display:none}
#rec.show{display:flex}
#rec .rh button{margin-left:auto;padding:0 8px;border:0;background:transparent}
dialog{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:min(820px,92vw);max-height:80vh;padding:0;margin:auto}
dialog::backdrop{background:#0008}
dialog input{width:calc(100% - 24px);margin:12px}
#hl{overflow:auto;max-height:62vh;padding:0 0 8px}
.hi{padding:6px 16px;cursor:pointer;border-top:1px solid var(--line)}
.hi:hover{background:var(--bg3)}
.hi small{color:var(--mut);display:block}
.hi code{white-space:pre-wrap;font:12.5px ui-monospace,monospace;display:block;max-height:5.6em;overflow:hidden}
#cf{padding:18px 22px;width:min(460px,92vw);display:flex;flex-direction:column;gap:10px}
#cf h3{margin:0 0 4px}
#cf label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut);flex:1}
#cf input{width:100%;margin:0;color:var(--fg)}
#cf .row{display:flex;gap:10px}#cf .sm{flex:0 0 100px}
#cf .cb{display:flex;gap:8px;margin-top:6px}
#cm{min-height:1.3em;font-size:13px;white-space:pre-wrap}#cm.ok{color:var(--ok)}#cm.bad{color:var(--err)}
button.danger{color:var(--err)}
button.pri.stop{background:var(--err);border-color:var(--err);color:#fff}
tr.more td{text-align:center;color:var(--mut);background:var(--bg2)!important;cursor:default}
.msg b{color:var(--fg);font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:.92}
#ver{font-size:12px;color:var(--mut);background:transparent;border:0;padding:0 4px;cursor:pointer}
#ver:hover{color:var(--fg)}
#upd{background:var(--ok);border-color:var(--ok);color:#fff}
</style>
</head>
<body>
<header>
  <button id="tg" title="Mostrar/ocultar tabelas">☰</button>
  <b class="logo">my</b>
  <select id="alias" title="Conexão"></select>
  <button id="ca" title="Nova conexão">＋</button><button id="ce" title="Editar esta conexão">✎</button>
  <input id="db" list="dbs" placeholder="banco (digite para filtrar)" autocomplete="off" title="Banco de dados">
  <datalist id="dbs"></datalist>
  <span id="st"><i></i><span>iniciando…</span></span>
  <span class="sp"></span>
  <button id="upd" hidden>⬆ Nova versão disponível</button>
  <button id="ver" class="mono" title="Clique para verificar atualizações">v…</button>
  <label class="mono" style="font-size:12.5px;color:var(--mut)">linhas máx.
    <select id="limit"><option>200</option><option selected>1000</option><option>5000</option><option>20000</option></select></label>
  <button id="hist" title="Alt+H">Histórico</button>
  <button id="run" class="pri" title="Ctrl+Enter ou F5">▶ Executar <kbd>Ctrl+↵</kbd></button>
</header>
<div id="main">
  <aside id="side">
    <div class="sh"><input id="tf" placeholder="filtrar tabelas…" autocomplete="off"><button id="rf" title="Recarregar tabelas e colunas (após criar/alterar tabelas)">⟳</button></div>
    <ul id="tables"></ul>
    <div id="cnt"></div>
  </aside>
  <section id="work">
    <div id="tabs"></div>
    <div id="ed"><pre id="hlight" aria-hidden="true"></pre><textarea id="sql" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="SELECT * FROM tabela LIMIT 100;   — Ctrl+Enter executa tudo (ou só a seleção) · Ctrl+Espaço sugere"></textarea></div>
    <div id="res"></div>
  </section>
  <aside id="rec"></aside>
</div>
<dialog id="hd"><input id="hq" placeholder="buscar no histórico…" autocomplete="off"><div id="hl"></div></dialog>
<dialog id="cd"><form id="cf" autocomplete="off">
  <h3 id="ct">Nova conexão</h3>
  <label>Nome da conexão<input id="cn" placeholder="ex.: producao" required></label>
  <div class="row"><label>Host / IP<input id="ch" placeholder="10.0.0.5" required></label><label class="sm">Porta<input id="cp" type="number" min="1" max="65535" value="3306"></label></div>
  <label>Usuário<input id="cu" autocomplete="off"></label>
  <label>Senha<input id="cw" type="password" autocomplete="new-password"></label>
  <div id="cm"></div>
  <div class="cb"><button type="button" id="cx" class="danger">Excluir</button><span class="sp"></span><button type="button" id="ctest">Testar</button><button type="button" id="cc">Cancelar</button><button type="submit" class="pri">Salvar</button></div>
</form></dialog>
<div id="ac"></div>
<div id="toast"></div>
<script>
const TOKEN='__TOKEN__';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bq=n=>'`'+n.replace(/`/g,'``')+'`';
const S={alias:'',db:'',lastDb:{},dbsCache:{},tabs:[],act:0,tables:[]};
let nextId=1,saveT=null;
let HIST=[],stateReady=false;

async function api(path,body){
  try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Token':TOKEN},body:JSON.stringify(body||{})});return await r.json()}
  catch(e){return{error:'Servidor local indisponível (a janela foi encerrada?)'}}
}
async function apiPw(path,body){
  let r=await api(path,body);
  if(r.need_password){
    const p=prompt('Senha de "'+body.alias+'" (não fica salva em disco):');
    if(p===null)return r;
    await api('/api/password',{alias:body.alias,password:p});
    r=await api(path,body);
  }
  return r;
}
function setStatus(t,k){const e=$('#st');e.className=k||'';e.querySelector('span').textContent=t;e.title=t}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1100)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado'),()=>toast('Não foi possível copiar'))}

/* ---------- estado ---------- */
/* estado guardado no servidor (~/.config/my-gui/state.json): sobrevive a fechar a janela */
let histDirty=false;
const stateDoc=()=>{const d={ui:{alias:S.alias,dbs:S.lastDb,act:S.act,tabs:S.tabs.map(t=>({title:t.title,sql:t.sql,pinned:!!t.pinned}))}};if(histDirty){d.hist=HIST;histDirty=false}return d};
function save(){if(!stateReady)return;clearTimeout(saveT);saveT=setTimeout(flush,250)}
function flush(){
  if(!stateReady)return;clearTimeout(saveT);
  const body=JSON.stringify({state:stateDoc()});
  fetch('/api/state/set',{method:'POST',keepalive:body.length<60000,headers:{'Content-Type':'application/json','X-Token':TOKEN},body}).catch(()=>{histDirty=true});
}
const cur=()=>S.tabs[S.act];
function newTab(sql='',title='consulta',pinned=false){S.tabs.push({id:nextId++,title,sql,pinned,results:[],error:null,running:false});S.act=S.tabs.length-1;drawTabs();loadEditor();save();return cur()}
function switchTab(i){S.act=i;drawTabs();loadEditor();save()}
function closeTab(i){
  if(!replaceResults(S.tabs[i]))return;
  if(S.tabs.length===1){Object.assign(S.tabs[0],{sql:'',title:'consulta',results:[],error:null,table:null});drawTabs();loadEditor();save();return}
  S.tabs.splice(i,1);S.act=Math.min(S.act,S.tabs.length-1);if(i<S.act)S.act--;drawTabs();loadEditor();save();
}
function drawTabs(){
  $('#tabs').innerHTML=S.tabs.map((t,i)=>`<div class="tab ${i===S.act?'on':''}" data-i="${i}"><span>${esc(t.title)}</span><b data-x="${i}">×</b></div>`).join('')+'<div class="tab" id="plus" title="Nova aba (Alt+N)">＋</div>';
}
function loadEditor(){setSql(cur().sql);renderRes();hideRec();acClose();updateRun()}
$('#tabs').addEventListener('click',e=>{
  const x=e.target.closest('[data-x]');if(x)return closeTab(+x.dataset.x);
  if(e.target.closest('#plus')){newTab();$('#sql').focus();return}
  const t=e.target.closest('.tab');if(t)switchTab(+t.dataset.i);
});
$('#tabs').addEventListener('auxclick',e=>{const t=e.target.closest('.tab[data-i]');if(t&&e.button===1)closeTab(+t.dataset.i)});
$('#sql').addEventListener('input',e=>{
  const tb=cur();tb.sql=e.target.value;
  if(!tb.pinned){tb.title=tb.sql.replace(/\s+/g,' ').trim().slice(0,28)||'consulta';const el=$('#tabs .tab.on span');if(el)el.textContent=tb.title}
  save();hlRender();
  if(AC.skip)return;
  if(AC.open||e.inputType==='insertText')acUpdate(false);
});
$('#sql').addEventListener('scroll',()=>{const h=$('#hlight'),t=$('#sql');h.scrollTop=t.scrollTop;h.scrollLeft=t.scrollLeft;acClose()});
$('#sql').addEventListener('click',acClose);
$('#sql').addEventListener('blur',acClose);
$('#sql').addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','Home','End','PageUp','PageDown'].includes(e.key))acClose()});
$('#sql').addEventListener('keydown',e=>{
  if(AC.open){
    if(e.key==='ArrowDown'){e.preventDefault();return acMove(1)}
    if(e.key==='ArrowUp'){e.preventDefault();return acMove(-1)}
    if((e.key==='Enter'||e.key==='Tab')&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){e.preventDefault();return acAccept(AC.sel)}
    if(e.key==='Escape'){e.preventDefault();return acClose()}
  }
  if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();return acUpdate(true)}
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'||e.key==='F5'){e.preventDefault();acClose();run()}
  else if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();document.execCommand('insertText',false,'  ')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='F5'){e.preventDefault();run()}
  if(e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();newTab();$('#sql').focus()}
  if(e.altKey&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(S.act)}
  if(e.altKey&&e.key.toLowerCase()==='h'){e.preventDefault();openHist()}
});

/* ---------- conexão / bancos / tabelas ---------- */
async function setAlias(a,keepDb){
  S.alias=a;save();$('#alias').value=a;S.tables=[];
  const pre=keepDb&&S.cache[a+'|'+keepDb];
  if(pre&&pre.tables){setDbValue(keepDb);S.tables=pre.tables}  // mostra o cache na hora
  drawTables();
  const cd=S.dbsCache[a];
  if(cd){S.dbs=cd;$('#dbs').innerHTML=cd.map(d=>`<option value="${esc(d)}">`).join('')}
  setStatus('conectando…','warn');
  const r=await apiPw('/api/databases',{alias:a});
  if(S.alias!==a)return;
  if(r.error){setStatus(r.error,'err');$('#dbs').innerHTML='';setDbValue('');return}
  S.dbsCache[a]=r.databases;
  $('#dbs').innerHTML=r.databases.map(d=>`<option value="${esc(d)}">`).join('');
  S.dbs=r.databases;setStatus('conectado','ok');
  const want=keepDb&&r.databases.includes(keepDb)?keepDb:(r.db||'');
  await setDb(want);
}
function setDbValue(d){S.db=d;$('#db').value=d}
async function setDb(d){
  setDbValue(d);S.lastDb[S.alias]=d;save();
  const e=d?ent(d):null;
  S.tables=(e&&e.tables)||[];drawTables();   // cache na hora; abaixo revalida em segundo plano
  if(!d)return;
  const r=await apiPw('/api/tables',{alias:S.alias,db:d});
  if(S.db!==d)return;
  if(r.error){setStatus(r.error,'err');return}
  const same=S.tables.length===r.tables.length&&S.tables.every((t,i)=>t[0]===r.tables[i][0]&&t[1]===r.tables[i][1]);
  e.tables=r.tables;
  if(!same){S.tables=r.tables;drawTables()}
}
function invalidate(db){const e=S.cache[ck(db)];if(e){e.cols={};e.pend.clear();e.names=null}}
$('#rf').addEventListener('click',()=>{if(!S.db)return;invalidate(S.db);setDb(S.db);toast('Recarregando…')});
$('#alias').addEventListener('change',e=>setAlias(e.target.value,S.lastDb[e.target.value]));
$('#db').addEventListener('change',e=>{const v=e.target.value.trim();if(!v)return setDb('');if(S.dbs&&S.dbs.includes(v))setDb(v);else{toast('Banco não encontrado');e.target.value=S.db}});
$('#db').addEventListener('focus',e=>e.target.select());

/* ---------- executar ---------- */
function danger(sql){
  const strip=s=>s.replace(/^(\s|--[^\n]*\n|#[^\n]*\n|\/\*[\s\S]*?\*\/)+/,'');
  return sql.split(';').map(strip).find(s=>/^(drop|truncate)\b/i.test(s)||(/^(delete|update)\b/i.test(s)&&!/\bwhere\b/i.test(s)));
}
async function run(){
  const t=cur(),ta=$('#sql');
  if(t.running)return toast('Já executando — use Cancelar (Esc)');
  const sql=ta.selectionStart!==ta.selectionEnd?ta.value.slice(ta.selectionStart,ta.selectionEnd):ta.value;
  if(!sql.trim())return;
  if(!S.alias)return toast('Escolha uma conexão');
  const dg=danger(sql);
  if(dg&&!confirm(`Comando destrutivo ou sem WHERE\nConexão: ${S.alias}${S.db?' · banco: '+S.db:''}\n\n${dg.trim().slice(0,240)}\n\nExecutar mesmo assim?`))return;
  if(!replaceResults(t))return;
  const source=t.table;
  const table=source?.sql===sql&&source.alias===S.alias&&source.db===S.db?source.name:undefined;
  t.running=true;t.error=null;t.qid=Math.random().toString(36).slice(2);t.t0=Date.now();t.qalias=S.alias;
  if(t===cur())renderRes();
  if(!t.pinned)t.title=sql.replace(/\s+/g,' ').trim().slice(0,28)||t.title;
  drawTabs();updateRun();startTick();
  const r=await apiPw('/api/query',{alias:t.qalias,db:S.db,sql,table,limit:+$('#limit').value,qid:t.qid});
  t.running=false;
  t.results=r.results||[];t.error=r.error||null;
  if(t===cur()){renderRes();hideRec();updateRun()}
  if(S.alias===t.qalias&&r.db!==undefined&&r.db!==null&&r.db!==S.db){setDbValue(r.db);setDb(r.db)}
  if(!r.error&&/\b(create|drop|alter|rename)\s+(or\s+replace\s+)?(table|view)\b/i.test(sql)&&S.db){invalidate(S.db);setDb(S.db)}
  pushHist(sql);save();
}
function cancelRun(){const t=cur();if(!t.running)return;api('/api/cancel',{alias:t.qalias,qid:t.qid});toast('Cancelando…')}
function updateRun(){const t=cur(),b=$('#run');b.classList.toggle('stop',!!t.running);b.innerHTML=t.running?'■ Cancelar <kbd>Esc</kbd>':'▶ Executar <kbd>Ctrl+↵</kbd>'}
let tick=null;
function startTick(){clearInterval(tick);tick=setInterval(()=>{const t=cur();if(!t.running){clearInterval(tick);return}const e=$('#res .msg b');if(e)e.textContent=((Date.now()-t.t0)/1000).toFixed(1)+' s'},200)}
$('#run').addEventListener('click',()=>cur().running?cancelRun():run());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!e.defaultPrevented&&cur().running&&!$('dialog[open]'))cancelRun()});

/* ---------- resultados ---------- */
const fmtMs=ms=>ms<1000?ms+' ms':(ms/1000).toFixed(2)+' s';
function renderRes(){
  const t=cur(),box=$('#res');
  moreObs.disconnect();
  if(t.running){box.innerHTML=`<div class="msg">Executando… <b>${((Date.now()-t.t0)/1000).toFixed(1)} s</b><br><br><small>Esc cancela</small></div>`;return}
  if(!t.results.length&&!t.error){box.innerHTML='<div class="msg">Escreva uma consulta e pressione <kbd>Ctrl</kbd> + <kbd>Enter</kbd><br><br>Clique numa tabela à esquerda para ver o conteúdo.</div>';return}
  box.innerHTML=t.results.map(blk).join('')+(t.error?`<div class="err">${esc(t.error)}</div>`:'');
  observeMore(box);
}
function blk(r,i){
  const q=esc(r.sql.replace(/\s+/g,' ').slice(0,140));
  if(!r.columns.length)return `<div class="blk ok"><div class="bh"><span class="q">${q}</span><span class="sp"></span><span class="meta">OK · ${r.affected} linha(s) afetada(s) · ${fmtMs(r.ms)}</span></div></div>`;
  const n=r.rows.length;
  return `<div class="blk" data-i="${i}"><div class="bh"><span class="q" title="${esc(r.sql)}">${q}</span><span class="meta">${n}${r.truncated?'+':''} linha(s) · ${fmtMs(r.ms)}${r.truncated?' · <b>cortado no máximo de linhas</b>':''}</span><span class="sp"></span><input class="f" placeholder="filtrar resultado…" value="${esc(r.filter||'')}"><span class="edit-actions">${editActions(r)}</span><button data-a="vert" class="${r.vert?'on':''}" title="Equivale ao \\G do mycli">Vertical</button><button data-a="csv">CSV</button></div>${r.editError?`<div class="err" role="alert">${esc(r.editError)}</div>`:''}<div class="gw">${grid(r)}</div></div>`;
}
function cmp(x,y){
  if(x===null||y===null)return (x===null)-(y===null);
  const nx=typeof x==='number'?x:(/^-?\d+(\.\d+)?$/.test(x)?parseFloat(x):NaN),ny=typeof y==='number'?y:(/^-?\d+(\.\d+)?$/.test(y)?parseFloat(y):NaN);
  if(!isNaN(nx)&&!isNaN(ny))return nx-ny;
  return String(x).localeCompare(String(y),undefined,{numeric:true,sensitivity:'base'});
}
function view(r){
  let idx=r.rows.map((_,i)=>i);
  const f=(r.filter||'').toLowerCase();
  if(f)idx=idx.filter(i=>r.rows[i].some(v=>v!==null&&String(v).toLowerCase().includes(f)));
  if(r.sort){const{j,d}=r.sort;idx.sort((a,b)=>cmp(r.rows[a][j],r.rows[b][j])*d)}
  return idx;
}
const CHUNK=300,MORE=600;
function rowHtml(r,i,k){
  let h=`<tr data-r="${i}"${r.sel===i?' class="sel"':''}><td class="rn">${k+1}</td>`;
  r.rows[i].forEach((_,j)=>{h+=cellHtml(r,i,j)});
  return h+'</tr>';
}
const moreRow=(r,idx,shown)=>shown<idx.length?`<tr class="more"><td colspan="${r.columns.length+1}">Mostrando ${shown} de ${idx.length} — role para carregar mais…</td></tr>`:'';
function grid(r){
  const idx=r._idx=view(r);
  if(r.vert)return vert(r,idx);
  r.shown=Math.min(CHUNK,idx.length);
  let h='<table class="g"><thead><tr><th class="rn">#</th>';
  r.columns.forEach((c,j)=>{h+=`<th data-j="${j}">${esc(c)}${r.sort&&r.sort.j===j?(r.sort.d>0?' ▲':' ▼'):''}</th>`});
  h+='</tr></thead><tbody>';
  for(let k=0;k<r.shown;k++)h+=rowHtml(r,idx[k],k);
  return h+moreRow(r,idx,r.shown)+'</tbody></table>'+(idx.length?'':'<div class="msg">Nenhuma linha.</div>');
}
const moreObs=new IntersectionObserver(es=>{
  for(const en of es){
    if(!en.isIntersecting)continue;
    const tr=en.target,b=tr.closest('.blk');if(!b)continue;
    const r=cur().results[+b.dataset.i];if(!r||!r._idx)continue;
    moreObs.unobserve(tr);
    const idx=r._idx,from=r.shown,to=Math.min(from+MORE,idx.length);let h='';
    for(let k=from;k<to;k++)h+=rowHtml(r,idx[k],k);
    r.shown=to;const tb=tr.parentNode;tr.remove();
    tb.insertAdjacentHTML('beforeend',h+moreRow(r,idx,to));
    const nm=tb.querySelector('tr.more');if(nm)moreObs.observe(nm);
  }
},{root:$('#res'),rootMargin:'800px'});
const observeMore=scope=>scope.querySelectorAll('tr.more').forEach(tr=>moreObs.observe(tr));
function kv(r,i){
  return '<table class="kv">'+r.columns.map((c,j)=>{const v=r.rows[i][j];return `<tr><th>${esc(c)}</th>${v===null?'<td class="nul">NULL</td>':`<td>${esc(v)}</td>`}</tr>`}).join('')+'</table>';
}
function vert(r,idx){
  let h=idx.slice(0,100).map((i,k)=>`<div class="rec"><div class="rh">Linha ${k+1}</div>${kv(r,i)}</div>`).join('');
  if(idx.length>100)h+=`<div class="msg">Mostrando 100 de ${idx.length} registros (use o filtro para reduzir).</div>`;
  return h||'<div class="msg">Nenhuma linha.</div>';
}
function csv(r){
  const q=v=>v===null?'':'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[r.columns.map(q).join(';')].concat(view(r).map(i=>r.rows[i].map(q).join(';')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='resultado.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
const regrid=(b,r)=>{const g=b.querySelector('.gw');g.innerHTML=grid(r);observeMore(g)};
const resOf=el=>{const b=el.closest('.blk');return b?[b,cur().results[+b.dataset.i]]:[]};

function replaceResults(t){
  if(t.results.some(r=>r.saving)){toast('Aguarde o término da gravação');return false}
  return !t.results.some(r=>r.drafts?.size)||confirm('Descartar as alterações pendentes nesta aba?');
}
addEventListener('beforeunload',e=>{
  if(S.tabs.some(t=>t.results.some(r=>r.drafts?.size))){e.preventDefault();e.returnValue=''}
});
function editActions(r){
  if(!r.edit)return r.edit_reason?`<button data-a="edit-info" title="${esc(r.edit_reason)}">Somente leitura</button>`:'';
  if(!r.drafts)return '<button data-a="edit"'+(r.vert?' disabled':'')+'>Editar dados</button>';
  const target=esc(r.edit.alias+' · '+r.edit.db+'.'+r.edit.table);
  const disabled=!r.drafts.size||r.saving?'disabled':'';
  return `<button class="pri" data-a="save" title="Gravar em ${target}" ${disabled}>${r.saving?'Salvando…':'Salvar'}</button>
    <button data-a="copy-update" ${disabled}>Copiar UPDATE</button>
    <button data-a="discard" ${r.saving?'disabled':''}>${r.drafts.size?'Descartar':'Sair da edição'}</button>`;
}
const shownValue=(r,i,j)=>r.drafts?.get(i)?.has(j)?r.drafts.get(i).get(j):r.rows[i][j];
function cellHtml(r,i,j){
  const v=shownValue(r,i,j),changed=r.drafts?.get(i)?.has(j);
  const canEdit=r.edit?.columns.includes(j)&&!r.saving;
  const style=[v===null?'nul':typeof v==='number'?'num':'',changed?'changed':'',canEdit?'can-edit':''].filter(Boolean).join(' ');
  const label=v===null?'NULL':esc(v);
  const editable=r.drafts&&canEdit;
  return `<td class="${style}" data-col="${j}"${canEdit&&!editable?' title="Duplo clique para editar"':''}>${editable?`<button type="button" class="cell-value"
    title="Editar ${esc(r.columns[j])}" aria-label="Editar ${esc(r.columns[j])}, linha ${i+1}">${label||'&nbsp;'}</button>`:label}</td>`;
}
function beginEdits(b,r){
  r.drafts=new Map();
  hideRec();
  b.querySelector('.edit-actions').innerHTML=editActions(r);
  for(const td of b.querySelectorAll('tr[data-r] td[data-col]')){
    const j=+td.dataset.col;
    if(r.edit.columns.includes(j))td.outerHTML=cellHtml(r,+td.closest('tr').dataset.r,j);
  }
}
function startCell(td,b,r){
  const i=+td.closest('tr').dataset.r,j=+td.dataset.col;
  const previous=shownValue(r,i,j);
  td.innerHTML=`<div class="cell-editor"><textarea rows="2" aria-label="${esc(r.columns[j])}" spellcheck="false"></textarea><button type="button" data-null title="Definir como NULL">NULL</button></div>`;
  const form=td.firstElementChild,input=form.querySelector('textarea');
  let editing=true;
  const draft=value=>{
    const original=r.rows[i][j];
    const row=r.drafts.get(i)||new Map();
    if(value===original||(original!==null&&value===String(original)))row.delete(j);
    else row.set(j,value);
    if(row.size)r.drafts.set(i,row);else r.drafts.delete(i);
    td.classList.toggle('changed',row.has(j));
    b.querySelector('.edit-actions').innerHTML=editActions(r);
  };
  const finish=focus=>{
    if(!editing||!td.isConnected)return;
    editing=false;
    td.outerHTML=cellHtml(r,i,j);
    if(focus)b.querySelector(`tr[data-r="${i}"] td[data-col="${j}"] button`)?.focus();
  };
  input.value=previous??'';
  input.addEventListener('input',()=>draft(input.value));
  form.querySelector('[data-null]').addEventListener('click',()=>{draft(null);finish(true)});
  form.addEventListener('focusout',e=>{if(!form.contains(e.relatedTarget))queueMicrotask(()=>finish(false))});
  form.addEventListener('keydown',e=>{
    if(e.key==='Escape'||(e.key==='Enter'&&!e.shiftKey&&e.target===input&&!e.isComposing)){
      e.preventDefault();
      e.stopPropagation();
      if(e.key==='Escape')draft(previous);
      finish(true);
    }
  });
  input.focus();input.select();
}
function editRequest(r,entries){
  const {alias,db,table,keys,versions}=r.edit;
  const changes=entries.map(([i,values])=>({
    key:keys.map(j=>r.rows[i][j]),version:versions[i],values:Object.fromEntries(values)
  }));
  return {alias,db,table,changes,columns:r.columns};
}
async function copyUpdate(r){
  if(r.saving||!r.drafts?.size)return;
  const t=cur();
  const entries=[...r.drafts].sort(([a],[b])=>a-b);
  const response=await apiPw('/api/table/preview',editRequest(r,entries));
  if(response.error){
    r.editError=response.error;
    if(t===cur()&&t.results.includes(r))renderRes();
  }else copy(response.sql);
}
async function saveEdits(r){
  if(r.saving||!r.drafts?.size)return;
  const t=cur(),{versions}=r.edit;
  const entries=[...r.drafts].sort(([a],[b])=>a-b);
  r.saving=true;r.editError=null;renderRes();
  const response=await apiPw('/api/table/save',editRequest(r,entries));
  r.saving=false;
  if(response.error)r.editError=response.error;
  else{
    response.saved.forEach(({row,version},k)=>{
      const i=entries[k][0];r.rows[i]=row;versions[i]=version;
    });
    r.drafts=null;
    toast('Alterações salvas');
  }
  if(t===cur()){renderRes();hideRec()}
}
$('#res').addEventListener('click',e=>{
  const[b,r]=resOf(e.target);if(!r)return;
  if(e.target.closest('.cell-editor'))return;
  const cell=e.target.closest('.cell-value');
  if(cell){hideRec();startCell(cell.closest('td'),b,r);return}
  const a=e.target.closest('[data-a]');
  if(a){
    switch(a.dataset.a){
      case 'edit-info':alert(r.edit_reason);break;
      case 'edit':beginEdits(b,r);break;
      case 'save':saveEdits(r);break;
      case 'copy-update':copyUpdate(r);break;
      case 'discard':
        if(!r.drafts.size||confirm('Descartar as alterações pendentes?')){
          r.drafts=null;r.editError=null;renderRes();
        }
        break;
      case 'vert':
        r.vert=!r.vert;a.classList.toggle('on',r.vert);
        b.querySelector('.edit-actions').innerHTML=editActions(r);regrid(b,r);break;
      case 'csv':csv(r);break;
    }
    return;
  }
  const th=e.target.closest('th[data-j]');
  if(th){const j=+th.dataset.j;r.sort=!r.sort||r.sort.j!==j?{j,d:1}:(r.sort.d>0?{j,d:-1}:null);regrid(b,r);return}
  const tr=e.target.closest('tr[data-r]');
  if(tr){
    const col=+e.target.closest('td')?.dataset.col;
    if(r.edit?.columns.includes(col)&&!r.saving)return; // evita abrir o painel entre os cliques
    r.sel=+tr.dataset.r;b.querySelectorAll('tr.sel').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');showRec(r,r.sel);return
  }
  const c=e.target.closest('.kv td');if(c)copy(c.textContent);
});
$('#res').addEventListener('dblclick',e=>{
  const td=e.target.closest('table.g tbody tr[data-r] td:not(.rn)');
  if(!td||e.target.closest('.cell-editor')||td.querySelector('.cell-value'))return;
  const [b,r]=resOf(td),j=+td.dataset.col;
  if(r?.edit?.columns.includes(j)&&!r.saving&&!r.drafts){
    e.preventDefault();
    const i=td.closest('tr').dataset.r;
    beginEdits(b,r);
    startCell(b.querySelector(`tr[data-r="${i}"] td[data-col="${j}"]`),b,r);
    return;
  }
  copy(td.classList.contains('nul')?'':td.textContent);
});
$('#res').addEventListener('input',e=>{
  if(!e.target.matches('.f'))return;
  const[b,r]=resOf(e.target);r.filter=e.target.value;regrid(b,r);
});
function showRec(r,i){
  $('#rec').innerHTML=`<div style="width:100%"><div class="rh">Registro (clique no valor para copiar)<button id="rx" title="Fechar">×</button></div>${kv(r,i)}</div>`;
  $('#rec').classList.add('show');
}
function hideRec(){$('#rec').classList.remove('show')}
$('#rec').addEventListener('click',e=>{
  if(e.target.id==='rx')return hideRec();
  const c=e.target.closest('.kv td');if(c)copy(c.textContent);
});

/* ---------- histórico ---------- */
function pushHist(sql){
  if(HIST[0]&&HIST[0].sql===sql)return;
  HIST.unshift({sql:sql.slice(0,12000),alias:S.alias,db:S.db,t:Date.now()});HIST=HIST.slice(0,300);histDirty=true;save();
}
function drawHist(){
  const q=$('#hq').value.toLowerCase();
  const h=HIST.map((x,k)=>({...x,k})).filter(x=>!q||x.sql.toLowerCase().includes(q)||(x.alias||'').includes(q)).slice(0,80);
  $('#hl').innerHTML=h.length?h.map(x=>`<div class="hi" data-k="${x.k}"><small>${esc(x.alias||'')} · ${esc(x.db||'')} · ${new Date(x.t).toLocaleString('pt-BR')}</small><code>${esc(x.sql.slice(0,400))}</code></div>`).join(''):'<div class="msg">Nada por aqui.</div>';
}
function openHist(){$('#hq').value='';drawHist();$('#hd').showModal();$('#hq').focus()}
$('#hist').addEventListener('click',openHist);
$('#hq').addEventListener('input',drawHist);
$('#hl').addEventListener('click',e=>{
  const it=e.target.closest('.hi');if(!it)return;
  const x=HIST[+it.dataset.k];if(!x)return;
  cur().sql=x.sql;setSql(x.sql);$('#hd').close();$('#sql').focus();save();
});
$('#hd').addEventListener('click',e=>{if(e.target.id==='hd')e.target.close()});

/* ---------- editor: destaque de sintaxe ---------- */
const KW=new Set('select from where and or not in is null like between exists case when then else end as on join inner left right outer cross natural using group by order having limit offset union all distinct insert into values update set delete create alter drop truncate table index view database schema if default primary key foreign references unique constraint add column modify change rename to show describe desc asc explain use begin commit rollback start transaction call with recursive over partition interval true false div mod xor regexp rlike binary collate charset engine auto_increment unsigned signed temporary replace ignore duplicate for lock share straight_join full tables databases columns status variables processlist grants'.split(' '));
const FUNCS='count sum avg min max concat concat_ws coalesce ifnull nullif if now curdate curtime current_timestamp date date_format str_to_date datediff date_add date_sub timestampdiff year month day hour minute second lower upper trim ltrim rtrim length char_length substring substr replace left right round floor ceil abs group_concat cast convert json_extract json_unquote json_object json_array row_number rank dense_rank lag lead find_in_set instr locate lpad rpad reverse uuid rand database version user last_insert_id found_rows greatest least extract format'.split(' ');
const STOP=new Set('on using where group order limit inner left right outer cross join natural set having union straight_join full values select window for lock partition into'.split(' '));
const HL_RE=/(--[^\n]*|#[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^'\\]|\\[\s\S]|'')*'?|"(?:[^"\\]|\\[\s\S]|"")*"?)|(`[^`]*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w$]*)(\s*\()?/g;
const tblSet=()=>S._ts||(S._ts=new Set(S.tables.map(t=>t[0].toLowerCase())));
function hlSql(s){
  const tb=tblSet();let out='',last=0,m;HL_RE.lastIndex=0;
  while((m=HL_RE.exec(s))){
    if(m.index>last)out+=esc(s.slice(last,m.index));
    last=HL_RE.lastIndex;
    let c='',txt=m[0],rest='';
    if(m[1])c='tc';else if(m[2])c='ts';else if(m[3])c=tb.has(m[3].replace(/`/g,'').toLowerCase())?'tb':'ti';else if(m[4])c='tn';
    else{const w=m[5],lw=w.toLowerCase();txt=w;rest=m[0].slice(w.length);c=KW.has(lw)?'tk':(m[6]?'tf':(tb.has(lw)?'tb':''))}
    out+=c?`<span class="${c}">${esc(txt)}</span>`:esc(txt);
    if(rest)out+=esc(rest);
  }
  return out+esc(s.slice(last))+'\n ';
}
let hlRaf=0,hlTo=0;
const paintHl=v=>{$('#hlight').innerHTML=v.length>300000?esc(v)+'\n ':hlSql(v)};
function hlRender(){
  const v=$('#sql').value;
  if(v.length<20000){cancelAnimationFrame(hlRaf);clearTimeout(hlTo);hlRaf=hlTo=0;paintHl(v);return}  // pequeno: na hora (sem piscar)
  if(hlRaf||hlTo)return;                                                                              // grande: 1x por quadro
  const go=()=>{cancelAnimationFrame(hlRaf);clearTimeout(hlTo);hlRaf=hlTo=0;paintHl($('#sql').value)};
  hlRaf=requestAnimationFrame(go);hlTo=setTimeout(go,80);  // o timeout cobre janela em segundo plano (rAF pausa)
}
function setSql(v){const t=$('#sql');t.value=v;hlRender();t.scrollTop=0;t.scrollLeft=0;$('#hlight').scrollTop=0;$('#hlight').scrollLeft=0}

/* ---------- editor: autocomplete ---------- */
const AC={open:false,items:[],sel:0,start:0,end:0,prefix:'',skip:false};
const ICON={table:'T',col:'C',kw:'K',fn:'ƒ',db:'D'};
S.cache={};
const ck=db=>S.alias+'|'+db;
const ent=db=>S.cache[ck(db)]||(S.cache[ck(db)]={cols:{},pend:new Set(),names:null});
function tnames(db){   // lower -> nome real, a partir de SHOW FULL TABLES (já carregado)
  const ts=tablesOf(db);if(!ts)return null;const e=ent(db);
  if(!e.names||e.namesSrc!==ts){e.names=new Map(ts.map(t=>[t[0].toLowerCase(),t[0]]));e.namesSrc=ts}
  return e.names;
}
let colTimer=null;const colQueue=new Map();
function queueCols(db,real){
  const e=ent(db);if(e.cols[real]||e.pend.has(real))return;
  e.pend.add(real);
  const k=ck(db),q=colQueue.get(k)||{alias:S.alias,db,set:new Set()};q.set.add(real);colQueue.set(k,q);
  clearTimeout(colTimer);colTimer=setTimeout(flushCols,30);   // agrupa vários pedidos numa ida só
}
function flushCols(){
  const jobs=[...colQueue.values()];colQueue.clear();
  for(const j of jobs){
    const tables=[...j.set];
    api('/api/columns',{alias:j.alias,db:j.db,tables}).then(r=>{
      const e=S.cache[j.alias+'|'+j.db];if(!e)return;
      for(const t of tables){e.pend.delete(t);if(r.columns)e.cols[t]=r.columns[t]||[]}
      if(document.activeElement===$('#sql'))acUpdate(false);
    });
  }
}
function colsOf(db,table){
  const names=tnames(db);if(!names)return null;
  const real=names.get(table.toLowerCase());if(!real)return[];
  const e=ent(db);if(e.cols[real])return e.cols[real];
  queueCols(db,real);return null;
}
function tablesOf(db){
  if(db===S.db)return S.tables;
  const e=ent(db);
  if(e.tables)return e.tables;
  if(!e.tl){e.tl=true;api('/api/tables',{alias:S.alias,db}).then(r=>{if(r.tables)e.tables=r.tables;else e.tl=false;if(document.activeElement===$('#sql'))acUpdate(false)})}
  return null;
}
const NOISE=/--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"/g;
function refsIn(stmt){
  const clean=stmt.replace(NOISE,' '),id='(?:`[^`]+`|[\\w$]+)',idq=`${id}(?:\\s*\\.\\s*${id})?`,map={};
  const add=(ref,al)=>{
    const p=ref.split(/\s*\.\s*/).map(x=>x.replace(/`/g,'')),table=p[p.length-1],db=p.length>1?p[0]:S.db;
    if(!table||table.toLowerCase()==='select')return;
    map[table.toLowerCase()]={db,table};
    const a=al&&al.replace(/`/g,'');
    if(a&&!STOP.has(a.toLowerCase()))map[a.toLowerCase()]={db,table};
  };
  for(const m of clean.matchAll(new RegExp(`\\b(?:join|update|into|describe|truncate(?:\\s+table)?|table)\\s+(${idq})(?:\\s+(?:as\\s+)?(${id}))?`,'gi')))add(m[1],m[2]);
  for(const m of clean.matchAll(/\bfrom\b([\s\S]*?)(?=\b(?:where|group|order|having|limit|union|join|inner|left|right|cross|natural|on|set|window|for)\b|[;)]|$)/gi))
    for(const seg of m[1].split(',')){const mm=seg.trim().match(new RegExp(`^(${idq})(?:\\s+(?:as\\s+)?(${id}))?\\s*$`,'i'));if(mm)add(mm[1],mm[2])}
  return map;
}
function rank(items,q){
  const o={col:0,table:1,db:2,kw:3,fn:4},out=[],seen=new Set();
  for(const it of items){
    const l=it.label.toLowerCase();let s;
    if(!q)s=1;else if(l.startsWith(q))s=0;else if(l.includes('_'+q))s=1;else if(l.includes(q))s=2;else continue;
    if(l===q&&(it.t==='kw'||it.t==='fn'))continue;
    const key=it.t+'|'+l+'|'+(it.detail||'');if(seen.has(key))continue;seen.add(key);
    out.push([s,o[it.t],it]);
  }
  out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2].label.localeCompare(b[2].label));
  return out.slice(0,14).map(x=>x[2]);
}
function acCandidates(text,pos,force){
  const m=/`?[\w$]*$/.exec(text.slice(0,pos)),prefix=m[0],start=pos-prefix.length;
  const a=text.lastIndexOf(';',start-1)+1;let b=text.indexOf(';',pos);if(b<0)b=text.length;
  const stmt=text.slice(a,b),stBefore=text.slice(a,start),q=prefix.replace(/^`/,'').toLowerCase();
  const dm=/(`[^`]+`|[\w$]+)\s*\.\s*$/.exec(stBefore);
  let items=[];
  if(dm){
    const ql=dm[1].replace(/`/g,'').toLowerCase(),hit=refsIn(stmt)[ql];
    let tgt=hit||(S.tables.some(t=>t[0].toLowerCase()===ql)?{db:S.db,table:ql}:null);
    if(tgt){const cs=colsOf(tgt.db,tgt.table);(cs||[]).forEach(c=>items.push({t:'col',label:c[0],detail:c[1]+(c[2]==='PRI'?' · PK':'')}))}
    else{
      const db=(S.dbs||[]).find(d=>d.toLowerCase()===ql);
      if(db)(tablesOf(db)||[]).forEach(t=>items.push({t:'table',label:t[0],detail:db}));
    }
    return{start,prefix,items:rank(items,q)};
  }
  if(!force&&q.length<1)return null;
  const toks=stBefore.replace(NOISE,' ').match(/`[^`]*`|[\w$]+|[^\s\w]/g)||[],tk=(toks[toks.length-1]||'').toLowerCase();
  let ctx='expr';
  if(['from','join','update','into','table','describe','truncate'].includes(tk)||(tk==='desc'&&toks.length===1))ctx='table';
  else if(tk==='use'&&toks.length===1)ctx='db';
  else if(tk===','){
    for(let i=toks.length-1;i>=0;i--){const t=toks[i].toLowerCase();if(t==='from'){ctx='table';break}if(['select','where','on','group','order','having','set','join','into','values','limit','(',')'].includes(t))break}
  }
  if(ctx==='db')(S.dbs||[]).forEach(d=>items.push({t:'db',label:d}));
  else if(ctx==='table'){
    S.tables.forEach(t=>items.push({t:'table',label:t[0],detail:t[1]==='VIEW'?'view':''}));
    (S.dbs||[]).forEach(d=>items.push({t:'db',label:d}));
  }else{
    const refs=refsIn(stmt),done=new Set();
    for(const r of Object.values(refs)){
      const key=r.db+'.'+r.table;if(done.has(key))continue;done.add(key);
      (colsOf(r.db,r.table)||[]).forEach(c=>items.push({t:'col',label:c[0],detail:r.table+' · '+c[1]}));
    }
    if(!done.size)S.tables.forEach(t=>items.push({t:'table',label:t[0]}));
    Object.keys(refs).forEach(a=>{if(refs[a].table.toLowerCase()!==a)items.push({t:'table',label:a,detail:'alias de '+refs[a].table})});
    KW.forEach(k=>items.push({t:'kw',label:k}));
    FUNCS.forEach(f=>items.push({t:'fn',label:f}));
  }
  return{start,prefix,items:rank(items,q)};
}
function acUpdate(force){
  const ta=$('#sql');
  if(ta.selectionStart!==ta.selectionEnd)return acClose();
  const r=acCandidates(ta.value,ta.selectionStart,force);
  if(!r||!r.items.length)return acClose();
  Object.assign(AC,{open:true,items:r.items,sel:0,start:r.start,end:ta.selectionStart,prefix:r.prefix});
  acDraw();
}
function caretXY(){
  const ta=$('#sql'),cs=getComputedStyle(ta),lines=ta.value.slice(0,ta.selectionStart).split('\n'),ln=lines.length-1;
  let col=0;for(const ch of lines[ln])col=ch==='\t'?(Math.floor(col/2)+1)*2:col+1;
  if(!caretXY.cw){const s=document.createElement('span');s.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-variant-ligatures:none;font-kerning:none;font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+';font-weight:'+cs.fontWeight;s.textContent='x'.repeat(100);document.body.appendChild(s);caretXY.cw=s.getBoundingClientRect().width/100;s.remove()}
  const lh=parseFloat(cs.lineHeight),r=ta.getBoundingClientRect();
  return{x:r.left+parseFloat(cs.paddingLeft)+col*caretXY.cw-ta.scrollLeft,y:r.top+parseFloat(cs.paddingTop)+(ln+1)*lh-ta.scrollTop,lh};
}
function acDraw(){
  const el=$('#ac');
  el.innerHTML=AC.items.map((it,i)=>`<div class="ai${i===AC.sel?' on':''}" data-i="${i}"><b class="ic ${it.t}">${ICON[it.t]}</b><span class="lb">${esc(it.label)}</span><small>${esc(it.detail||'')}</small></div>`).join('');
  el.style.display='block';
  const p=caretXY(),w=el.offsetWidth,h=el.offsetHeight;
  let x=p.x,y=p.y+2;
  if(x+w>innerWidth-8)x=Math.max(8,innerWidth-w-8);
  if(y+h>innerHeight-8)y=Math.max(8,p.y-p.lh-h-2);
  el.style.left=x+'px';el.style.top=y+'px';
}
function acClose(){AC.open=false;$('#ac').style.display='none'}
function acMove(d){
  AC.sel=(AC.sel+d+AC.items.length)%AC.items.length;
  const el=$('#ac');el.querySelector('.on')?.classList.remove('on');
  const n=el.children[AC.sel];n.classList.add('on');n.scrollIntoView({block:'nearest'});
}
function acAccept(i){
  const it=AC.items[i],ta=$('#sql');if(!it)return;
  const up=/[A-Z]/.test(AC.prefix)&&AC.prefix===AC.prefix.toUpperCase();
  let txt=it.label;
  if(it.t==='kw')txt=up?txt.toUpperCase():txt;
  else if(it.t==='fn')txt=(up?txt.toUpperCase():txt)+'(';
  else if(AC.prefix.startsWith('`')||!/^[A-Za-z_][\w$]*$/.test(txt))txt='`'+txt+'`';
  AC.skip=true;ta.focus();ta.setSelectionRange(AC.start,AC.end);
  document.execCommand('insertText',false,txt);
  AC.skip=false;acClose();
}
$('#ac').addEventListener('mousedown',e=>{e.preventDefault();const it=e.target.closest('.ai');if(it)acAccept(+it.dataset.i)});

/* ---------- gerenciar conexões ---------- */
S.aliases=[];
async function loadAliases(want){
  const r=await api('/api/aliases');S.aliases=r.aliases||[];
  $('#alias').innerHTML=S.aliases.map(a=>`<option value="${esc(a.name)}">${esc(a.name)} — ${esc(a.host)}:${a.port}</option>`).join('');
  $('#ce').disabled=!S.aliases.length;
  if(!S.aliases.length){setStatus('Nenhuma conexão — clique em ＋','err');return null}
  const names=S.aliases.map(a=>a.name);
  const a=names.includes(want)?want:names[0];$('#alias').value=a;return a;
}
let CD={edit:false};
function openConn(edit){
  const a=edit?S.aliases.find(x=>x.name===S.alias):null;
  if(edit&&!a)return;
  CD.edit=!!a;
  $('#ct').textContent=a?`Editar conexão “${a.name}”`:'Nova conexão';
  $('#cn').value=a?a.name:'';$('#cn').readOnly=!!a;
  $('#ch').value=a?a.host:'';$('#cp').value=a?a.port:3306;$('#cu').value=a?a.user:'';$('#cw').value='';
  $('#cw').placeholder=a?'(em branco = manter a atual)':'(em branco = perguntar ao conectar)';
  $('#cx').style.display=a?'':'none';
  cmsg('');$('#cd').showModal();(a?$('#ch'):$('#cn')).focus();
}
function cmsg(t,k){const e=$('#cm');e.textContent=t;e.className=k||''}
const cbody=()=>({name:$('#cn').value.trim(),host:$('#ch').value.trim(),port:+$('#cp').value||3306,user:$('#cu').value,password:(CD.edit&&!$('#cw').value)?null:$('#cw').value});
$('#ca').addEventListener('click',()=>openConn(false));
$('#ce').addEventListener('click',()=>openConn(true));
$('#cc').addEventListener('click',()=>$('#cd').close());
$('#ctest').addEventListener('click',async()=>{
  cmsg('Testando…');const r=await api('/api/alias/test',cbody());
  r.error?cmsg(r.error,'bad'):cmsg(r.message,'ok');
});
$('#cf').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=cbody(),r=await api('/api/alias/save',b);
  if(r.error)return cmsg(r.error,'bad');
  $('#cd').close();
  const a=await loadAliases(b.name);toast('Conexão salva');
  if(a)await setAlias(a,'')
});
$('#cx').addEventListener('click',async()=>{
  const n=$('#cn').value;
  if(!confirm(`Excluir a conexão “${n}”? (remove do ~/.myclirc)`))return;
  const r=await api('/api/alias/delete',{name:n});
  if(r.error)return cmsg(r.error,'bad');
  $('#cd').close();
  const a=await loadAliases('');toast('Conexão excluída');
  if(a)await setAlias(a,'');else{S.alias='';S.tables=[];drawTables();setDbValue('')}
});

/* ---------- atualização ---------- */
let UPD={};
function drawUpd(r){
  if(!r||r.error&&!r.current&&!r.latest)return;
  UPD=r;$('#ver').textContent='v'+r.current;
  const b=$('#upd');b.hidden=!(r.available&&r.can_update);
  if(!b.hidden){b.textContent='⬆ Atualizar para v'+r.latest;b.title='Nova versão disponível'+(r.notes?'\n\n'+r.notes.slice(0,400):'')}
}
const updStatus=()=>api('/api/update/status').then(drawUpd);
$('#ver').addEventListener('click',async()=>{
  toast('Verificando atualizações…');
  const r=await api('/api/update/check');drawUpd(r);
  toast(r.available?'Nova versão: v'+r.latest:r.error?'Não foi possível verificar agora':'Você está na versão mais recente');
});
$('#upd').addEventListener('click',async()=>{
  if(S.tabs.some(t=>t.results.some(r=>r.saving||r.drafts?.size)))return alert('Salve ou descarte as alterações pendentes antes de atualizar.');
  if(!confirm('Atualizar de v'+UPD.current+' para v'+UPD.latest+'?\n\nA janela será recarregada; abas, SQL e histórico são mantidos.'+(UPD.notes?'\n\n'+UPD.notes.slice(0,600):'')))return;
  const b=$('#upd');b.disabled=true;b.textContent='Atualizando…';
  flush();
  const r=await api('/api/update/apply');
  if(r.url){if(r.error)alert(r.error);flush();location.replace(r.url);return}
  b.disabled=false;b.textContent='⬆ Atualizar para v'+UPD.latest;
  alert(r.error||'Não foi possível atualizar.');
});

/* ---------- início ---------- */
(async function init(){
  setInterval(()=>api('/api/ping'),5000);api('/api/ping');
  updStatus();setTimeout(updStatus,12000);setInterval(updStatus,15*60000);
  addEventListener('pagehide',()=>{flush();navigator.sendBeacon('/api/bye?t='+encodeURIComponent(TOKEN),'')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  const r=await api('/api/state/get'),stt=r.state||{},st=stt.ui||{};
  HIST=Array.isArray(stt.hist)?stt.hist:[];
  S.lastDb=st.dbs||{};
  const saved=(st.tabs||[]).filter(t=>t&&typeof t.sql==='string');
  if(saved.length){saved.forEach(t=>S.tabs.push({id:nextId++,title:t.title||'consulta',sql:t.sql,pinned:!!t.pinned,results:[],error:null,running:false}));S.act=Math.min(Math.max(st.act||0,0),S.tabs.length-1)}
  else S.tabs.push({id:nextId++,title:'consulta',sql:'',results:[],error:null,running:false});
  stateReady=true;
  drawTabs();loadEditor();
  const want=new URLSearchParams(location.search).get('a');
  const a=await loadAliases(want||st.alias);
  if(!a){openConn(false);return}
  await setAlias(a,S.lastDb[a]);
  $('#sql').focus();
})();
</script>
