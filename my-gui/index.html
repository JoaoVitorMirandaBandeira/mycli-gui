// Duplo clique: seleciona a tabela (e o apelido) no editor, dentro da consulta explicada.
function findInEditor(n){
  if(n.kind!=='table')return;
  const doc=editor.state.doc.toString(),base=doc.indexOf(E.r.sql);if(base<0)return toast('A consulta mudou no editor');
  const t=nameOf(E.P,n),a=aliasOf(E.P,n),re=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const m=new RegExp('`?\\b'+re+'\\b`?'+(a?'(?:\\s+(?:as\\s+)?`?'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b`?)?':''),'i').exec(E.r.sql);
  if(!m)return toast('Tabela não encontrada no texto da consulta');
  editor.dispatch({selection:{anchor:base+m.index,head:base+m.index+m[0].length},scrollIntoView:true});editor.focus();
}

// arredonda para baixo: um ganho de 99,6% aparece como −99%, nunca como −100%
const pct=(b,a)=>(a<=b?'−':'+')+C.nf.format(Math.floor(Math.abs(1-a/b)*100))+'%';
const gain=x=>pct(x.before,x.after);
const realWin=x=>x.real?.state==='ok'&&x.real.after<x.real.before*.9;
const refresh=r=>{if(E?.r===r){insights();if(E.st.view==='sug')other()}};
// Tempo real com EXPLAIN ANALYZE: EXECUTA as consultas (só leitura; as linhas não são trazidas).
// Quando é rápido, roda duas vezes e fica com o menor tempo, para tirar o efeito do cache frio.
async function timeOf(r,sql,box){
  const run=async()=>{const qid=Math.random().toString(36).slice(2);box.qid=qid;
    const a=await apiPw('/api/measure',{alias:r.alias,db:r.db,sql,qid});if(a.error)throw new Error(a.error);return a.ms};
  const t=await run();return t<2000?Math.min(t,await run()):t;
}
const RUN_MSG='Isto EXECUTA a consulta atual e as alternativas no servidor, só para medir o tempo (as linhas não são trazidas).\n\nEm tabelas grandes pode demorar e pesar no banco. Continuar?';
async function measure(r,list){
  if(!confirm(RUN_MSG))return;
  for(const x of list)x.real={state:'run'};
  r.base=r.base?.state==='ok'?r.base:{state:'run'};refresh(r);
  try{if(r.base.state!=='ok')r.base={state:'ok',ms:await timeOf(r,r.sql,r.base)}}
  catch(e){r.base={state:'err',err:e.message};for(const x of list)x.real={state:'err',err:e.message};return refresh(r)}
  for(const x of list){
    refresh(r);
    try{x.real={state:'ok',before:r.base.ms,after:await timeOf(r,x.sql,x.real)}}catch(e){x.real={state:'err',err:e.message}}
  }
  refresh(r);
}

/* --- reescritas e alternativas: valida cada uma com EXPLAIN (não executa a consulta) --- */
const orderOf=P=>PlanRewrite.topJoin(P)?.children.map(c=>c.title);
async function validate(r){
  const base=r._P.total;
  for(const x of r.rw){
    const resp=await api('/api/explain',{alias:r.alias,db:r.db,sql:x.sql});
    if(resp.error){x.state='err';x.err=resp.error;console.warn('reescrita inválida',x.id,resp.error,x.sql)}
    else try{
      const P2=C.analyze({root:C.parse(resp.plan),alias:refsIn(resp.sql)});
      x.before=base;x.after=P2.total;x.resp=resp;x.state=x.after<base*.95?'ok':'flat';
      // hint ignorado pelo servidor (versão antiga, LEFT JOIN que obriga a ordem…): não é alternativa
      if(x.expect&&String(orderOf(P2))!==String(x.expect)){x.state='err';x.err='ordem não aplicada'}
    }catch(e){x.state='err';x.err=e.message}
    refresh(r);
  }
}
function suggestions(){
  const {r}=E,L=(r.rw||[]).filter(x=>x.state!=='err');
  if(!L.length)return `<div class="pv-empty">Nenhuma reescrita ou alternativa de plano se aplica a esta consulta.<br><br>
    O app procura: subquery correlacionada com agregação (vira JOIN), DATE()/YEAR() sobre a coluna (vira faixa), texto comparado com número e, em JOINs, outras ordens de leitura das tabelas. Veja também os diagnósticos acima: índices na coluna de junção, histogramas para estimativas chutadas, OFFSET grande e ORDER BY … LIMIT.</div>`;
  const orig=SqlFormat.format(r.sql),readOnly=/^[(\s]*(select|with|table)\b/i.test(sqlCommand(r.sql));
  const rank=x=>realWin(x)?0:x.state==='ok'?1:x.state==='wait'?2:x.kind==='hint'?3:4;
  const B=r.base,run=L.some(x=>x.real?.state==='run'),can=readOnly&&L.some(x=>x.resp&&!x.real);
  const head=`<div class="pv-sughead"><span>${L.length} sugest${L.length>1?'ões':'ão'}${B?.state==='ok'?` · consulta atual: <b>${fmtMs(B.ms)}</b> de verdade`:''}</span><span class="sp"></span>
    ${readOnly?`<button class="pv-measureall"${run||!can?' disabled':''} title="Executa a consulta atual e cada alternativa (só leitura) com EXPLAIN ANALYZE e compara o tempo">⏱ Medir todas de verdade</button>`:'<span class="pv-mt">Medir só está disponível para SELECT.</span>'}</div>`;
  return head+L.sort((a,b)=>rank(a)-rank(b)).map(x=>{
    const k=r.rw.indexOf(x),sql=SqlFormat.format(x.sql),hint=x.kind==='hint';
    const st=x.state==='wait'?'<span class="pv-badge">conferindo com EXPLAIN…</span>'
      :x.state==='ok'?`<span class="pv-badge ok">custo ${C.fmtN(x.before)} → ${C.fmtN(x.after)} · ${gain(x)}</span>`
      :`<span class="pv-badge">${hint?'custo estimado':'sem ganho estimado'} ${C.fmtN(x.before)} → ${C.fmtN(x.after)}</span>`;
    const R=x.real,rt=!R?'':R.state==='run'?'<span class="pv-badge">medindo… <a href="#" class="pv-mcancel" data-k="'+k+'">cancelar</a></span>'
      :R.state==='err'?`<span class="pv-badge bad" title="${h(R.err)}">não foi possível medir</span>`
      :`<span class="pv-badge ${realWin(x)?'ok':R.after>R.before*1.1?'bad':''}">tempo real ${fmtMs(R.before)} → ${fmtMs(R.after)} · ${pct(R.before,R.after)}</span>`;
    const note=x.state!=='flat'||R?'':hint?'<p>O otimizador estima um custo maior para esta ordem (por isso não a escolheu). Se as estimativas dele estiverem erradas, ela pode ser mais rápida: só a medição real decide.</p>'
      :'<p>O otimizador não estima ganho, mas as estimativas erram bastante com tabelas derivadas e subqueries. Meça de verdade antes de descartar.</p>';
    return `<section class="pv-rw ${realWin(x)?'ok':x.state}"><h3>${hint?'<span class="pv-kind">alternativa de plano</span>':''}${h(x.title)} ${st} ${rt}</h3>${note}<p>${h(x.why)}</p>${x.caveat?`<p class="pv-cav">⚠ ${h(x.caveat)}</p>`:''}
      <div class="pv-cols"><div><h4>Atual</h4><div class="pv-code" data-sql="${h(orig)}"></div></div><div><h4>${hint?'Com a ordem forçada':'Sugerida'}</h4><div class="pv-code" data-sql="${h(sql)}"></div></div></div>
      <div class="pv-codeb"><button class="pv-rwopen pri" data-k="${k}"${x.resp?'':' disabled'}>Abrir em nova aba com o plano</button><button class="pv-cp" data-sql="${h(sql+';')}">Copiar</button>${x.resp&&readOnly?`<button class="pv-measure" data-k="${k}"${R?.state==='run'?' disabled':''} title="Executa a consulta atual e esta (só leitura) com EXPLAIN ANALYZE e compara o tempo">⏱ Medir de verdade</button>`:''}</div></section>`;
  }).join('')+'<p class="pv-hint" style="padding:4px 14px 14px">Os custos são estimativas do otimizador; os tempos reais vêm do EXPLAIN ANALYZE. Confira o resultado da consulta nova antes de trocar a original.</p>';
}

/* --- outras visões --- */
function setView(v){E.st.view=v;E.el.querySelectorAll('.pv-seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const d=v==='diag';q('.pv-cv').style.display=d?'':'none';q('.pv-view').style.display=d?'none':'block';
  E.el.querySelectorAll('.pv-zoom,.pv-svg,.pv-color').forEach(x=>x.style.visibility=d?'':'hidden');
  if(d){draw();if(!E.st.V||E.st.auto)fit()}else other()}
function other(){
  const {P,r,st}=E,v=st.view,w=q('.pv-view');
  if(v==='tree'){
    let s='<table class="g"><thead><tr><th>Nó</th><th>Acesso</th><th>Índice</th><th class="num">Lidas</th><th class="num">Seguem</th><th class="num">filtered</th><th>Custo</th></tr></thead><tbody>';
    C.walk(P.root,(n,p,d)=>{const A=C.ACC[n.access],nm=n.kind==='nl'?`junção (${n.children.length} tabelas)`:n.kind==='table'?nameOf(P,n)+(aliasOf(P,n)?' '+aliasOf(P,n):''):n.title,t=n.kind==='table';
      s+=`<tr data-id="${n.id}"${st.sel===n.id?' class="sel"':''}><td><span class="pv-tn" style="padding-left:${d*18}px">${d?'└ ':''}${t?`<i style="background:${C.accVar(n.access)}"></i>`:''}<b>${h(nm)}</b>${n.flags.length?` <span class="pv-w">${h(n.flags.join(', '))}</span>`:''}</span></td>
        <td>${A?h(A.pt):''}</td><td class="mono">${h(n.key)}</td><td class="num">${t?C.fmtN(n.est.scan):''}</td><td class="num">${t?C.fmtN(n.est.rows):''}</td><td class="num">${t&&n.est.filtered!=null?C.nf.format(n.est.filtered)+'%':''}</td>
        <td>${t?`<div class="pv-pct">${C.fmtN(n.est.cost)}<div class="pv-bar"><i style="width:${n.pct*100}%;background:${C.heat(n.pct)}"></i></div><span class="pv-mt">${C.pctS(n.pct)}</span></div>`:n.est.cost!=null?C.fmtN(n.est.cost):''}</td></tr>`});
    w.innerHTML=s+'</tbody></table>';
  }else if(v==='sug')hydrate(w,suggestions(),viewCodes);
  else if(v==='tab')w.innerHTML=tabular(r)+'<div class="pv-hint" style="padding:10px 12px">EXPLAIN tradicional, o mesmo do terminal.</div>';
  else{
    let src=r.plan;try{src=JSON.stringify(JSON.parse(r.plan),null,2)}catch(_){}
    w.innerHTML=`<div class="pv-rawbar"><span class="pv-mt">Saída do EXPLAIN FORMAT=JSON</span><span class="sp"></span><button class="pv-cpj">Copiar JSON</button></div><pre class="mono pv-raw">${h(src).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(-?\d+(?:\.\d+)?|true|false|null)\b/g,(m,a,c,n)=>a?`<span class="${c?'k':'s'}">${a}</span>${c||''}`:`<span class="n">${n}</span>`)}</pre>`;
  }
}

/* --- exportar --- */
function exportSvg(){
  const {P}=E,live=q('.pv-sv'),s=live.cloneNode(true),a=live.querySelectorAll('*'),b=s.querySelectorAll('*');
  b.forEach((el,i)=>{const cs=getComputedStyle(a[i]);for(const p of ['fill','stroke','stroke-width','stroke-dasharray','opacity','font-size','font-weight','font-family'])el.style[p]=cs[p]});
  s.querySelector('.pv-vp').setAttribute('transform','translate(30,30)');
  s.setAttribute('viewBox',`0 0 ${P.W+60} ${P.H+60}`);s.setAttribute('width',P.W+60);s.setAttribute('height',P.H+60);s.setAttribute('xmlns','http://www.w3.org/2000/svg');
  s.insertAdjacentHTML('afterbegin',`<rect width="100%" height="100%" fill="${getComputedStyle(document.body).backgroundColor}"/>`);
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([s.outerHTML],{type:'image/svg+xml'}));l.download='plano.svg';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),3000);
}

/* --- montagem: liga os eventos ao bloco recém-desenhado --- */
function mount(el,r){
  const P=model(r);if(!P)return;
  E={r,el,P,st:r.pv};
  const cv=q('.pv-cv');
  if(!r.rw){try{r.rw=PlanRewrite.rewrites(r.sql,P,r.notes,r.server).map(x=>({...x,state:'wait'}))}catch(e){r.rw=[];console.warn('reescritas',e)}if(r.rw.length&&r.alias)validate(r)}
  insights();details();q('.pv-det').classList.toggle('show',E.st.sel!=null);
  // espera o layout do bloco para medir a área do diagrama
  requestAnimationFrame(()=>{if(E?.el===el)setView(E.st.view)});
  cv.addEventListener('wheel',e=>{e.preventDefault();const b=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-b.left,e.clientY-b.top)},{passive:false});
  cv.addEventListener('pointerdown',e=>{if(e.button||e.target.closest('.pv-mini'))return;E.drag={x:e.clientX,y:e.clientY,vx:E.st.V.x,vy:E.st.V.y,moved:false};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{const d=E.drag;if(!d)return tip(e);const dx=e.clientX-d.x,dy=e.clientY-d.y;
    if(!d.moved&&Math.abs(dx)+Math.abs(dy)>3){d.moved=true;cv.classList.add('drag');$('#pvtip').style.display='none'}
    if(d.moved){E.st.V.x=d.vx+dx;E.st.V.y=d.vy+dy;E.st.auto=false;view()}});
  cv.addEventListener('pointerup',e=>{const d=E.drag;E.drag=null;cv.classList.remove('drag');
    if(d&&!d.moved){const g=document.elementFromPoint(e.clientX,e.clientY)?.closest('.pv-nd');select(g?+g.dataset.id:null)}});
  cv.addEventListener('dblclick',e=>{const g=e.target.closest('.pv-nd');if(g)findInEditor(byId(+g.dataset.id))});
  cv.addEventListener('pointerleave',()=>$('#pvtip').style.display='none');
  cv.addEventListener('keydown',e=>{const k=e.key,mid=[cv.clientWidth/2,cv.clientHeight/2];
    if(k==='f'||k==='F')fit();else if(k==='+'||k==='=')zoomAt(1.2,...mid);else if(k==='-')zoomAt(1/1.2,...mid);else if(k==='Escape'&&E.st.sel!=null){e.preventDefault();select(null)}else return;e.preventDefault()});
  q('.pv-mini').addEventListener('pointerdown',e=>{e.stopPropagation();const s=q('.pv-mini svg');
    const mv=ev=>{const pt=s.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(s.getScreenCTM().inverse()),V=E.st.V;V.x=cv.clientWidth/2-p.x*V.k;V.y=cv.clientHeight/2-p.y*V.k;E.st.auto=false;view()};
    mv(e);const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
  el.addEventListener('click',e=>{
    const v=e.target.closest('.pv-seg button');if(v)return setView(v.dataset.v);
    const z=e.target.closest('.pv-zoom button');if(z){const mid=[cv.clientWidth/2,cv.clientHeight/2];return z.dataset.z==='f'?fit():zoomAt(z.dataset.z==='+'?1.2:1/1.2,...mid)}
    if(e.target.closest('.pv-svg'))return exportSvg();
    if(e.target.closest('.pv-x'))return select(null);
    const cp=e.target.closest('.pv-cp');if(cp)return copy(cp.dataset.sql);
    const op=e.target.closest('.pv-open');if(op){newTab(op.dataset.sql+'\n',op.dataset.title);editor.focus();return}
    if(e.target.closest('.pv-cpj'))return copy(E.r.plan);
    if(e.target.closest('.pv-instg'))return insToggle();
    if(e.target.closest('.pv-rwc'))return setView('sug');
    const ms=e.target.closest('.pv-measure');if(ms)return measure(E.r,[E.r.rw[+ms.dataset.k]]);
    if(e.target.closest('.pv-measureall'))return measure(E.r,E.r.rw.filter(x=>x.resp&&x.state!=='err'&&x.real?.state!=='ok'));
    const mc=e.target.closest('.pv-mcancel');if(mc){e.preventDefault();const x=E.r.rw[+mc.dataset.k],qid=E.r.base?.state==='run'?E.r.base.qid:x.real?.qid;if(qid)api('/api/cancel',{alias:E.r.alias,qid});return}
    const ro=e.target.closest('.pv-rwopen');if(ro){const x=E.r.rw[+ro.dataset.k],a=E.r.alias,db=E.r.db;const t=newTab(SqlFormat.format(x.sql)+';\n','reescrita');t.results=[planResult(x.resp,a,db)];renderRes();editor.focus();return}
    const ic=e.target.closest('.pv-ic');if(ic){const x=E.P.ins[+ic.dataset.k];if(E.st.view!=='diag')setView('diag');select(x.n.id);if(x.n.x!=null)center(x.n);return}
    const tr=e.target.closest('.pv-view tr[data-id]');if(tr)return select(+tr.dataset.id);
    const tt=e.target.closest('.pv-view tr[data-t]');if(tt){const n=E.P.nodes.find(n=>n.kind==='table'&&n.title===tt.dataset.t);if(n)select(n.id)}
  });
  q('.pv-color').addEventListener('change',e=>{E.st.color=e.target.value;draw()});
}
addEventListener('resize',()=>{if(E&&E.el.isConnected&&E.st.view==='diag'&&E.st.V){if(E.st.auto)fit();else miniVp()}});
return {html,mount};
})();
/* ---------- plano de execução: ação "Explicar" ---------- */
// Mesma escolha de trecho do Executar: a seleção ou a consulta sob o cursor. O servidor roda
// EXPLAIN FORMAT=JSON, que não executa a consulta — vale até para UPDATE e DELETE.
const planResult=(r,alias,db)=>({sql:r.sql,columns:[],rows:[],plan:r.plan,rewritten:r.rewritten,notes:r.notes,tabular:r.tabular,server:r.server,ms:r.ms,db,alias});
async function explain(){
  const t=cur();if(!t)return;
  if(t.running)return toast('Já executando — use Cancelar (Esc)');
  const {doc,selection}=editor.state,{from,to,empty}=selection.main;
  let sql;
  try{
    if(!empty){sql=doc.sliceString(from,to);if(!sqlStatements(sql).length)return toast('Nenhuma consulta para explicar')}
    else{
      const a=statementAt(doc,from);if(!a)return toast('Nenhuma consulta para explicar');
      const st=doc.sliceString(a.from,a.to);sql=a.delimiter===';'?st:'DELIMITER '+a.delimiter+'\n'+st;
    }
  }catch(error){if(!(error instanceof SqlParseError))throw error;return toast(error.message)}
  if(!S.alias)return toast('Escolha uma conexão');
  if(!replaceResults(t))return;
  t.running=true;t.error=null;t.qid=Math.random().toString(36).slice(2);t.t0=Date.now();t.qalias=S.alias;
  if(t===cur())renderRes();
  updateRun();startTick();
  const r=await apiPw('/api/explain',{alias:t.qalias,db:S.db,sql,qid:t.qid});
  t.running=false;t.back=[];
  t.results=r.error?[]:[planResult(r,t.qalias,S.db)];
  t.error=r.error||null;
  if(t===cur()){renderRes();hideRec();updateRun()}
}

(async function init(){
  pingLoop();
  updStatus();setTimeout(updStatus,12000);setInterval(()=>{if(!DEAD)updStatus()},15*60000);
  addEventListener('pagehide',()=>{flush();navigator.sendBeacon('/api/bye?t='+encodeURIComponent(TOKEN),'')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
  const r=await api('/api/state/get'),stt=r.state||{},st=stt.ui||{};
  HIST=Array.isArray(stt.hist)?stt.hist:[];
  S.lastDb=st.dbs||{};
  const saved=(st.tabs||[]).filter(t=>t&&typeof t.sql==='string');
  if(saved.length){saved.forEach(t=>S.tabs.push({id:nextId++,title:t.title||'consulta',sql:t.sql,pinned:!!t.pinned,results:[],error:null,running:false,back:[]}));S.act=Math.min(Math.max(st.act||0,0),S.tabs.length-1)}
  else S.tabs.push({id:nextId++,title:'consulta',sql:'',results:[],error:null,running:false,back:[]});
  stateReady=true;
  drawTabs();loadEditor();
  const want=new URLSearchParams(location.search).get('a');
  const a=await loadAliases(want||st.alias);
  if(!a){openConn(false);return}
  await setAlias(a,S.lastDb[a]);
  editor.focus();
})();

try{const h=+localStorage.getItem('edH');if(h>=56)ed.style.height=h+'px'}catch(_){}

const y0=e.clientY,h0=ed.offsetHeight;
const mv=ev=>{const max=$('#work').clientHeight-$('#tabs').offsetHeight-80;ed.style.height=Math.max(56,Math.min(max,h0+ev.clientY-y0))+'px'};

sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);sp.addEventListener('pointercancel',up)});
sp.addEventListener('dblclick',()=>{ed.style.height='150px';try{localStorage.removeItem('edH')}catch(_){}})})();
